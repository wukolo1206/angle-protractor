<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>活動二　測量角的大小和畫角</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>活動二　測量角的大小和畫角</h1>
    <span class="src">課本 印 p36–40</span>
    <a class="home" href="index.html">← 回首頁</a>
  </header>

  <div class="tabs">
    <button data-tab="explore">🔍 探索</button>
    <button data-tab="practice">✏️ 練習</button>
    <button data-tab="challenge">🏆 挑戰</button>
  </div>

  <section data-panel="explore">
    <div class="physical">網頁練完，課堂要用真的量角器再量一次。網頁上擺得好，不代表真的量角器也會擺。</div>
    <div class="levels" id="exNav"></div>
    <div class="stage">
      <div class="board"><svg id="exSvg" viewBox="0 0 640 480"></svg></div>
      <div class="side">
        <h2 id="exTitle"></h2>
        <div class="q" id="exText"></div>
        <div id="exCtrl"></div>
        <div class="msg" id="exMsg"></div>
      </div>
    </div>
  </section>

  <section data-panel="practice">
    <div class="levels" id="lvNav"></div>
    <div id="lvStage"></div>
  </section>

  <section data-panel="challenge">
    <p class="warn">擺法判斷挑戰：題型改寫自習作 印p32 第 1 題，擺法由系統產生，<b>不是原題</b>。</p>
    <div id="chBox"></div>
  </section>
</div>

<script src="angle-core.js"></script>
<script src="protractor.js"></script>
<script src="ui.js"></script>
<script>
(function () {
  'use strict';
  var C = window.AngleCore, h = UI.h;
  var VB = '0 0 640 480';

  var MSG = {
    CORRECT: '答對了！',
    WRONG_RING: '這個角比直角（90°）大還是小？再看看角的一邊壓在哪一圈的 0。',
    NEAR_MISS: '差一點點，一小格一小格數。',
    AMBIGUOUS: '再數一次，從 0 開始數到另一條邊。',
    OTHER: '從刻度 0 開始，數到角的另一邊為止。',
    CENTER_OFF: '量角器的中心點還沒對到角的頂點。',
    ZERO_LINE_OFF: '刻度 0 的線還沒壓在角的一條邊上。轉動外面的圓環，或按 ◀1°、1°▶。',
    ANGLE_OUTSIDE: '0 線對到邊了，但角沒有被量角器蓋住。量角器要蓋在角的裡面，轉過來試試。',
    SHORT: '0 線對好了，可是角的邊太短，看不到刻度。把邊拉長一點。'
  };

  function rint(lo, hi) { return lo + Math.floor(Math.random() * (hi - lo + 1)); }
  function kind(c) { return c < 90 ? '銳角' : (c === 90 ? '直角' : '鈍角'); }
  function animate(ms, step, done) {
    var t0 = null;
    function f(t) { if (t0 === null) t0 = t; var k = Math.min(1, (t - t0) / ms); step(k); if (k < 1) requestAnimationFrame(f); else if (done) done(); }
    requestAnimationFrame(f);
  }
  function endPoint(V, dir, len) { var p = AP.pt(dir, len); return { x: V.x + p.x, y: V.y + p.y }; }
  function drawEdge(g, V, dir, len, cls) {
    var e = endPoint(V, dir, len);
    return AP.el('line', { x1: V.x, y1: V.y, x2: e.x, y2: e.y, 'class': cls || 'ray' }, g);
  }
  function setEdge(line, V, dir, len) { var e = endPoint(V, dir, len); line.setAttribute('x2', e.x); line.setAttribute('y2', e.y); }

  /* ================================================================
   * 🔍 探索
   * ============================================================== */
  var exSvg = document.getElementById('exSvg');
  var exTitle = document.getElementById('exTitle'), exText = document.getElementById('exText');
  var exCtrl = document.getElementById('exCtrl'), exMsg = document.getElementById('exMsg');
  var exNav = document.getElementById('exNav');
  var EXPLORE = [
    { id: 'e1', label: '測量三步驟（問1）', run: exSteps },
    { id: 'e2', label: '邊太短（問2）', run: exShort },
    { id: 'e-att', label: '附件7 實測（問3）', run: exAttach },
    { id: 'e3', label: '奇奇和妙妙（動動腦）', run: exQiqi },
    { id: 'e4', label: '平角（問7）', run: exStraight },
    { id: 'e-draw', label: '畫角步驟（問9）', run: exDraw }
  ];

  // 問3 印p36：附件7 實測。課本未印度數，網頁不判對錯；自己和同學記錄後比一比
  function exAttach() {
    exTitle.textContent = '拿出附件 7 的 4 個角，量量看，各是幾度？';
    exText.textContent = '請用真的量角器量。附件上角的度數課本沒有印出來，網頁沒辦法幫你對答案。量完記在下面，再和同學比一比。';
    var cap = AP.el('text', { x: 16, y: 34, 'font-size': 22, fill: '#00695c', 'font-weight': 700 }, exSvg);
    cap.textContent = '附件 7：量角的三個步驟';
    var prot = AP.drawProtractor(exSvg, { r: 190, style: 'L' });
    AP.place(prot, 320, 300, 0);
    STEP_TEXT.forEach(function (t, i) {
      var tx = AP.el('text', { x: 24, y: 372 + i * 32, 'font-size': 18, fill: '#263238' }, exSvg);
      tx.textContent = t;
    });
    var rows = [];
    exCtrl.appendChild(h('div', { 'class': 'row' }, [
      h('span', { text: '', style: 'min-width:48px' }),
      h('span', { text: '我量到', style: 'min-width:96px;font-weight:700' }),
      h('span', { text: '同學量到', style: 'font-weight:700' })
    ]));
    [1, 2, 3, 4].forEach(function (n) {
      var me = h('input', { 'class': 'num', type: 'number', inputmode: 'numeric', 'data-f': 'me' + n });
      var mate = h('input', { 'class': 'num', type: 'number', inputmode: 'numeric', 'data-f': 'mate' + n });
      rows.push([n, me, mate]);
      exCtrl.appendChild(h('div', { 'class': 'row' }, [h('span', { text: '∠' + n, style: 'min-width:48px;font-size:1.2rem' }), me, mate]));
    });
    exCtrl.appendChild(h('div', { 'class': 'row' }, [h('button', { 'class': 'btn primary', text: '比一比', 'data-act': 'compare', onclick: function () {
      var ok = [], far = [], empty = [];
      rows.forEach(function (r) {
        var a = parseInt(r[1].value, 10), b = parseInt(r[2].value, 10);
        if (isNaN(a) || isNaN(b)) { empty.push('∠' + r[0]); return; }
        var d = Math.abs(a - b);
        if (d <= 2) ok.push('∠' + r[0]); else far.push('∠' + r[0] + ' 差 ' + d + '°');
      });
      var parts = [];
      if (ok.length) parts.push(ok.join('、') + ' 兩個人量的相差在 2° 以內。');
      if (far.length) parts.push(far.join('、') + '，兩個人再一起量一次：中心點對齊頂點、刻度 0 的線對齊一邊，再數到另一邊。');
      if (empty.length) parts.push(empty.join('、') + ' 還沒填完。');
      UI.say(exMsg, parts.join(''), far.length ? 'bad' : 'ok');
    } })]));
  }

  // 問9 印p40：畫指定角度的四個步驟（角度、方向、用哪一圈都隨機）
  // 課本原文步驟②寫「直線對齊內圈刻度0」是配合課本圖的擺法；方向隨機時改說「對齊刻度 0 的線」並提示是哪一圈
  var DRAW_TEXT = [
    '① 先畫一條直線當作角的一邊，把線的一端當作角的頂點。',
    '② 把量角器的中心點對準頂點，直線對齊刻度 0 的線。',
    '③ 順著這一圈的刻度數，在要畫的度數的地方做一個記號。',
    '④ 拿開量角器，將頂點和記號連成一直線，並標上弧線和度數。'
  ];
  function exDraw() {
    exTitle.textContent = '要怎麼畫出指定度數的角？';
    exText.textContent = '課本 問9 印p40 的四個步驟。按「換一個角度」，要畫的度數和方向都會不一樣。';
    var R = 190, LEN = 215, V, t, b, side, rot, ring, newDir, st, prot, root, caption, baseLine, busy = false;

    var list = h('ul', { style: 'list-style:none;padding:0;margin:8px 0' });
    DRAW_TEXT.forEach(function () { list.appendChild(h('li', { style: 'padding:6px 10px;border-radius:10px;line-height:1.6;margin:2px 0' })); });
    function setStep(n) {
      Array.prototype.forEach.call(list.children, function (li, i) {
        var k = i + 1;
        li.style.fontWeight = k === n ? '700' : '400';
        li.style.background = k === n ? '#e0f2f1' : 'transparent';
        li.style.color = k < n ? '#2e7d32' : '#263238';
        li.textContent = (k < n ? '✓ ' : '') + DRAW_TEXT[i];
      });
      var caps = ['步驟①　畫一條直線，一端是頂點', '步驟②　中心點對準頂點，直線對齊 0', '步驟③　數到 ' + t + ' 度，做記號', '步驟④　拿開量角器，連成一直線'];
      caption.textContent = n >= 1 && n <= 4 ? caps[n - 1] : '畫好了！' + t + '° 的角';
    }
    function place() { AP.place(prot, st.cx, st.cy, st.rot); }
    function run(fn) { if (busy) return; busy = true; fn(function () { busy = false; }); }
    function moveTo(x, y, ms, done) {
      var x0 = st.cx, y0 = st.cy;
      animate(ms, function (k) { st.cx = x0 + (x - x0) * k; st.cy = y0 + (y - y0) * k; place(); }, done);
    }
    function rotTo(r, ms, done) {
      var r0 = st.rot, d = ((r - r0) % 360 + 540) % 360 - 180;
      animate(ms, function (k) { st.rot = r0 + d * k; place(); }, function () { st.rot = AP.norm360(r); place(); if (done) done(); });
    }
    function grow(line, dir, ms, done) {
      animate(ms, function (k) {
        var e = AP.pt(dir, LEN * k);
        line.setAttribute('x2', V.x + e.x); line.setAttribute('y2', V.y + e.y);
      }, done);
    }

    var d1 = h('button', { 'class': 'btn primary', text: '步驟①', 'data-act': 'draw1', onclick: function () {
      run(function (done) {
        d1.disabled = true; setStep(1);
        UI.say(exMsg, DRAW_TEXT[0], 'ok');
        AP.el('circle', { cx: V.x, cy: V.y, r: 5, fill: '#1e88e5' }, root);
        grow(baseLine, b, 900, function () { d2.disabled = false; setStep(2); done(); });
      });
    } });
    var d2 = h('button', { 'class': 'btn primary', text: '步驟②', 'data-act': 'draw2', disabled: 'disabled', onclick: function () {
      run(function (done) {
        d2.disabled = true;
        UI.say(exMsg, DRAW_TEXT[1] + '這條直線壓在' + RING_NAME2[ring] + '的 0 上，等一下就順著這一圈數。', 'ok');
        moveTo(V.x, V.y, 800, function () { rotTo(rot, 800, function () { d3.disabled = false; setStep(3); done(); }); });
      });
    } });
    var d3 = h('button', { 'class': 'btn primary', text: '步驟③', 'data-act': 'draw3', disabled: 'disabled', onclick: function () {
      run(function (done) {
        d3.disabled = true;
        var dot = AP.el('circle', { r: 6, fill: '#ef6c00' }, root);
        animate(1300, function (k) {
          var e = AP.pt(b + (newDir - b) * k, R + 10);
          dot.setAttribute('cx', V.x + e.x); dot.setAttribute('cy', V.y + e.y);
        }, function () {
          dot.remove();
          var m = AP.pt(newDir, R + 10);
          AP.el('circle', { cx: V.x + m.x, cy: V.y + m.y, r: 7, fill: '#d32f2f', 'data-mark': '1' }, root);
          AP.highlightLabel(prot, ring, side === 1 ? t : 180 - t);
          UI.say(exMsg, '③ 順著' + RING_NAME2[ring] + '的刻度，從 0 數到 ' + t + '，在 ' + t + ' 度的地方做一個記號（紅點）。', 'ok');
          d4.disabled = false; setStep(4); done();
        });
      });
    } });
    var d4 = h('button', { 'class': 'btn primary', text: '步驟④', 'data-act': 'draw4', disabled: 'disabled', onclick: function () {
      run(function (done) {
        d4.disabled = true;
        // 移到畫面外，才看得出「拿開量角器」
        moveTo(110, 760, 700, function () {
          var line = AP.el('line', { x1: V.x, y1: V.y, x2: V.x, y2: V.y, 'class': 'ray2', 'data-drawn': '1' }, root);
          grow(line, newDir, 800, function () {
            AP.el('path', { d: AP.arcPath(b, newDir, 42), fill: 'none', stroke: '#d32f2f', 'stroke-width': 3, transform: 'translate(' + V.x + ' ' + V.y + ')' }, root);
            var lp = AP.pt((b + newDir) / 2, 70);
            var lab = AP.el('text', { x: V.x + lp.x, y: V.y + lp.y, 'font-size': 24, 'font-weight': 700, fill: '#d32f2f', 'text-anchor': 'middle', 'dominant-baseline': 'middle' }, root);
            lab.textContent = t + '°';
            UI.say(exMsg, DRAW_TEXT[3] + '這樣就畫好 ' + t + '° 的角了。接著在紙上用直尺和量角器畫出 70° 和 135° 的角（課本 做做看），課本容許 2 度以內的誤差。', 'ok');
            setStep(5); done();
          });
        });
      });
    } });

    function newAngle() {
      if (busy) return;
      AP.clear(exSvg); exSvg.setAttribute('viewBox', VB);
      t = rint(2, 16) * 10;                     // 20°～160°，整十（刻度標示看得清楚）
      b = rint(0, 359);                          // 直線方向隨機
      side = Math.random() < 0.5 ? 1 : 2;        // 1：新邊在逆時針側（對齊量角器 θ=0 端）；2：順時針側（θ=180 端）
      rot = side === 1 ? b : b - 180;
      newDir = side === 1 ? b + t : b - t;
      ring = C.ringReading(side === 1 ? 0 : 180, 'L', 'inner') === 0 ? 'inner' : 'outer';
      V = { x: 320 + rint(-40, 40), y: 250 + rint(-15, 15) };
      root = AP.el('g', { 'data-target': t }, exSvg);
      baseLine = AP.el('line', { x1: V.x, y1: V.y, x2: V.x, y2: V.y, 'class': 'ray', 'data-base': '1' }, root);
      prot = AP.drawProtractor(exSvg, { r: R, style: 'L' });
      st = { cx: 110, cy: 460, rot: 0 };
      place();
      caption = AP.el('text', { x: 16, y: 34, 'font-size': 22, fill: '#00695c', 'font-weight': 700 }, exSvg);
      d1.disabled = false; d2.disabled = true; d3.disabled = true; d4.disabled = true;
      setStep(1);
      UI.say(exMsg, '要畫 ' + t + '° 的角。按「步驟①」開始。');
    }

    exCtrl.appendChild(list);
    exCtrl.appendChild(h('div', { 'class': 'row' }, [d1, d2, d3, d4]));
    exCtrl.appendChild(h('div', { 'class': 'row' }, [h('button', { 'class': 'btn', text: '換一個角度', 'data-act': 'new-draw', onclick: newAngle })]));
    newAngle();
  }
  EXPLORE.forEach(function (e, i) {
    exNav.appendChild(h('button', { text: e.label, 'data-ex': e.id, onclick: function () { showExplore(i); } }));
  });
  function showExplore(i) {
    Array.prototype.forEach.call(exNav.children, function (b, j) { b.classList.toggle('on', i === j); });
    AP.clear(exSvg); exSvg.setAttribute('viewBox', VB);
    exCtrl.innerHTML = ''; UI.say(exMsg, '');
    EXPLORE[i].run();
  }

  // E1 問1 印p36：隨機角度、隨機方向（無限換題），相同三步驟
  // 步驟文字照課本 印p36；步驟②另加「角要包含在量角器裡面」與「只對齊一邊的兩種狀況」例子
  var STEP_TEXT = [
    '① 把量角器的中心點對齊角的頂點。',
    '② 將刻度 0 的線，對齊角的一邊。角要包含在量角器裡面。',
    '③ 從刻度 0 開始，數到角的另一邊為止。'
  ];
  var STEP_CAPTION = ['步驟①　中心點對齊頂點', '步驟②　0 的線對齊一邊，角在量角器裡面', '步驟③　從 0 數到另一邊'];
  var RING_NAME2 = { inner: '紅字那一圈（內圈）', outer: '黑字那一圈（外圈）' };

  function exSteps() {
    exTitle.textContent = '要怎麼用量角器量出這個角是幾度？';
    exText.textContent = '課本 問1 印p36 的三個步驟。按「換一個角」，角的大小和方向都會不一樣，一樣照三個步驟量。';
    var R = 170, V, c, e1, e2, alignEdge, rotOK, ring, st, prot, caption, busy = false;

    var stepBox = h('ul', { style: 'list-style:none;padding:0;margin:8px 0' });
    STEP_TEXT.forEach(function () {
      stepBox.appendChild(h('li', { style: 'padding:6px 10px;border-radius:10px;line-height:1.6;margin:2px 0' }));
    });
    function setStep(n) { // n：目前在第幾步（1～3）；4＝三步都完成
      Array.prototype.forEach.call(stepBox.children, function (li, i) {
        var k = i + 1;
        li.style.fontWeight = k === n ? '700' : '400';
        li.style.background = k === n ? '#e0f2f1' : 'transparent';
        li.style.color = k < n ? '#2e7d32' : '#263238';
        li.textContent = (k < n ? '✓ ' : '') + STEP_TEXT[i];
      });
      caption.textContent = n >= 1 && n <= 3 ? STEP_CAPTION[n - 1] : (n === 4 ? '量好了！' : '');
    }

    function place() { AP.place(prot, st.cx, st.cy, st.rot); }
    function run(fn) { if (busy) return false; busy = true; fn(function () { busy = false; }); return true; }
    function moveTo(x, y, ms, done) {
      var x0 = st.cx, y0 = st.cy;
      animate(ms, function (k) { st.cx = x0 + (x - x0) * k; st.cy = y0 + (y - y0) * k; place(); }, done);
    }
    function rotTo(r, ms, done) {
      var r0 = st.rot, d = ((r - r0) % 360 + 540) % 360 - 180; // 走最短的方向轉
      animate(ms, function (k) { st.rot = r0 + d * k; place(); }, function () { st.rot = AP.norm360(r); place(); if (done) done(); });
    }
    function clearLit() {
      Array.prototype.forEach.call(prot.querySelectorAll('.pr-lit, [data-lit]'), function (n) { n.remove(); });
    }

    var b1 = h('button', { 'class': 'btn primary', text: '步驟①', 'data-act': 'step1', onclick: function () {
      run(function (done) {
        b1.disabled = true; setStep(1);
        UI.say(exMsg, STEP_TEXT[0] + '量角器底邊中間的小黑點就是中心點。', 'ok');
        moveTo(V.x, V.y, 900, function () { b2.disabled = false; setStep(2); done(); });
      });
    } });
    var b2 = h('button', { 'class': 'btn primary', text: '步驟②', 'data-act': 'step2', disabled: 'disabled', onclick: function () {
      run(function (done) {
        b2.disabled = true;
        UI.say(exMsg, STEP_TEXT[1] + '刻度 0 的線壓在角的一條邊上，而且整個角都被量角器蓋住。', 'ok');
        rotTo(rotOK, 900, function () { b3.disabled = false; caseRow.hidden = false; done(); });
      });
    } });
    var b3 = h('button', { 'class': 'btn primary', text: '步驟③', 'data-act': 'step3', disabled: 'disabled', onclick: function () {
      run(function (done) {
        b3.disabled = true; caseRow.hidden = true; clearLit(); setStep(3);
        rotTo(rotOK, 400, function () {
          var t0 = alignEdge === 1 ? 0 : 180, t1 = alignEdge === 1 ? c : 180 - c;
          var w = AP.wedge(prot, 0, 0, Math.min(t0, t1), Math.max(t0, t1), R * 0.95, 'wedge');
          w.setAttribute('transform', ''); w.setAttribute('data-lit', '1'); w.style.fill = 'rgba(255, 213, 79, .35)';
          AP.highlightLabel(prot, ring, t0); AP.highlightLabel(prot, ring, t1);
          UI.say(exMsg, STEP_TEXT[2] + '這條邊壓在' + RING_NAME2[ring] + '的 0，從 0 數到另一條邊是 ' + c + '，所以這個角是 ' + c + '°，是' + kind(c) + '。', 'ok');
          setStep(4); done();
        });
      });
    } });

    var bCase1 = h('button', { 'class': 'btn', text: '狀況一：角在量角器裡面', 'data-act': 'case-in', onclick: function () {
      run(function (done) {
        clearLit();
        UI.say(exMsg, '狀況一：刻度 0 的線對齊角的一邊，量角器蓋住整個角，另一條邊碰得到刻度，可以讀出角度。✓ 這樣才對。', 'ok');
        rotTo(rotOK, 700, done);
      });
    } });

      var baseLine = prot.querySelector('.pr-base');
      var ends = [], hdl = [];
      if (short) {
        [0, 1].forEach(function (i) {
          var hc = AP.el('circle', { r: 20, 'class': 'handle' }, ui.svg);
          hdl.push(hc);
          AP.drag(ui.svg, hc, { move: function (p) {
            var dir = i ? e2 : e1, u = AP.pt(dir, 1);
            len[i] = Math.max(70, Math.min(300, (p.x - V.x) * u.x + (p.y - V.y) * u.y));
            placeEnds(); check();
          } });
        });
      }
      function placeEnds() {
        setEdge(l1, V, e1, len[0]); setEdge(l2, V, e2, len[1]);
        hdl.forEach(function (hc, i) { var e = endPoint(V, i ? e2 : e1, len[i]); hc.setAttribute('cx', e.x); hc.setAttribute('cy', e.y); });
      }
      placeEnds();
      function place() { AP.place(prot, st.cx, st.cy, st.rot); }
      place();

      var inp = h('input', { 'class': 'num', type: 'number', inputmode: 'numeric', 'data-f': 'ans', disabled: 'disabled' });
      var rotL = h('button', { 'class': 'btn', text: '◀1°', 'data-act': 'rotL', disabled: 'disabled', onclick: function () { st.rot += 1; place(); check(); } });
      var rotR = h('button', { 'class': 'btn', text: '1°▶', 'data-act': 'rotR', disabled: 'disabled', onclick: function () { st.rot -= 1; place(); check(); } });
      var stepText = h('div', { 'class': 'q' });
      ui.inputs.appendChild(stepText);
      ui.inputs.appendChild(h('div', { 'class': 'row' }, [rotL, rotR]));
      ui.inputs.appendChild(h('div', { 'class': 'row' }, [inp, h('span', { text: '度' })]));
      var checkBtn = h('button', { 'class': 'btn primary', text: '確定', 'data-act': 'check', onclick: submit });
      ui.btns.appendChild(checkBtn);
      ui.btns.appendChild(h('button', { 'class': 'btn', text: '重擺', 'data-act': 'reset', onclick: function () {
        st = { cx: 130, cy: 420, rot: 0, stage: 'A' }; place(); setStageA();
      } }));

      function setStageA() {
        st.stage = 'A'; ring.setAttribute('visibility', 'hidden');
        rotL.disabled = true; rotR.disabled = true; inp.disabled = true; baseLine.classList.remove('okline');
        stepText.textContent = '步驟①：拖動量角器，把中心點對到角的頂點。';
        UI.say(ui.msg, '');
      }
      setStageA();

      var grab = null;
      AP.drag(ui.svg, prot, {
        start: function (p, e) {
          if (e.target === ring) { if (st.stage === 'A') return; grab = { mode: 'rot', a0: AP.angleAt(st.cx, st.cy, p.x, p.y), r0: st.rot }; }
          else if (st.stage === 'A') grab = { mode: 'move', dx: p.x - st.cx, dy: p.y - st.cy };
          else grab = null;
        },
        move: function (p) {
          if (!grab) return;
          if (grab.mode === 'move') { st.cx = p.x - grab.dx; st.cy = p.y - grab.dy; place(); }
          else { st.rot = Math.round(grab.r0 + AP.angleAt(st.cx, st.cy, p.x, p.y) - grab.a0); place(); check(); }
        },
        end: function () {
          if (!grab) return;
          if (grab.mode === 'move') {
            var r = C.checkAlignment({ cx: st.cx, cy: st.cy, rot: st.rot, r: R }, { vx: V.x, vy: V.y, e1: e1, e2: e2 });
            if (r.code === 'CENTER_OFF') UI.say(ui.msg, MSG.CENTER_OFF, 'bad');
            else {
              var x0 = st.cx, y0 = st.cy;
              animate(250, function (k) { st.cx = x0 + (V.x - x0) * k; st.cy = y0 + (V.y - y0) * k; place(); }, function () {
                st.stage = 'B'; ring.setAttribute('visibility', 'visible'); rotL.disabled = false; rotR.disabled = false;
                stepText.textContent = '步驟②：轉動外面的圓環（或按 ◀1°、1°▶），讓刻度 0 的線壓在角的一條邊上。';
                check();
                // check() 會寫入下一步提示，把「中心點對好了」接在前面，避免被蓋掉
                if (!aligned) UI.say(ui.msg, '中心點對好了！' + ui.msg.textContent, 'ok');
              });
            }
          }
          grab = null;
        }
      });

      var aligned = null;
      function check() {
        if (st.stage === 'A') return;
        var r = C.checkAlignment({ cx: st.cx, cy: st.cy, rot: st.rot, r: R }, { vx: V.x, vy: V.y, e1: AP.norm360(e1), e2: AP.norm360(e2) });
        aligned = null;
        baseLine.classList.toggle('okline', r.code === 'ALIGNED');
        if (r.code !== 'ALIGNED') { inp.disabled = true; stepText.textContent = '步驟②：轉動外面的圓環（或按 ◀1°、1°▶），讓刻度 0 的線壓在角的一條邊上。'; UI.say(ui.msg, MSG[r.code], r.code === 'ANGLE_OUTSIDE' ? 'bad' : ''); return; }
        // checkAlignment 回傳的 otherTheta 就是 norm360(那條邊 − rot)，比對即可知道是哪一條邊
        var otherIdx = Math.abs(AP.norm360(e1 - st.rot) - r.otherTheta) < 1e-6 ? 0 : 1;
        var otherLen = len[otherIdx];
        if (otherLen < R * 0.62) { inp.disabled = true; UI.say(ui.msg, MSG.SHORT, ''); return; }
        aligned = r;
        inp.disabled = false;
        stepText.textContent = '步驟③：從刻度 0 開始，數到角的另一邊為止。';
        UI.say(ui.msg, '0 線壓在邊上了！讀讀看是幾度。', 'ok');
      }

      function submit() {
        if (!aligned) { UI.say(ui.msg, st.stage === 'A' ? MSG.CENTER_OFF : MSG.ZERO_LINE_OFF, 'bad'); return; }
        var v = parseInt(inp.value, 10);
        if (isNaN(v)) { UI.say(ui.msg, '先填一個數字。', 'bad'); return; }
        var code;
        if (Math.abs(v - c) <= C.READ_TOL) code = 'CORRECT';
        else if (Math.abs(v - (180 - c)) <= C.READ_TOL) code = 'WRONG_RING';
        else code = C.diagnoseReadingSingle({ answer: v, rays: [0, c], style: 'L' }).code;
        if (code !== 'CORRECT') { UI.say(ui.msg, MSG[code], 'bad'); return; }
        UI.say(ui.msg, '答對了！這個角是 ' + c + '°，是' + kind(c) + '。', 'ok');
        nextBtn(ui, idx === N - 1, api, function () { idx++; load(); });
      }
    }
    load();
  }

  // 關4 動動腦 量法對嗎
  function scenario(type) {
    var c = rint(6, 30) * 5, base = type === 'ok' ? 0 : rint(15, 35) * (Math.random() < 0.5 ? 1 : -1);
    var V = { x: 320, y: 300 };
    var s = { type: type, c: c, base: base, V: V, cx: V.x, cy: V.y, rot: base };
    if (type === 'center') { var u = AP.pt(base, 50); s.cx = V.x - u.x; s.cy = V.y - u.y; }
    if (type === 'zero') s.rot = base + (Math.random() < 0.5 ? 14 : -14);
    return s;
  }
  function drawScenario(svg, s, R) {
    AP.clear(svg);
    var p = AP.drawProtractor(svg, { r: R, style: 'L' }); AP.place(p, s.cx, s.cy, s.rot);
    drawEdge(svg, s.V, s.base, R + 50); drawEdge(svg, s.V, s.base + s.c, R + 50);
    AP.el('circle', { cx: s.V.x, cy: s.V.y, r: 4, fill: '#1e88e5' }, svg);
  }
  var REASONS = [['center', '中心點沒對到頂點'], ['zero', '刻度 0 的線沒壓在邊上'], ['tilt', '量角器擺斜了']];

  function renderJudge(stage, api) {
    var types = UI.shuffle(['ok', 'tilt', 'center', 'zero']).concat(UI.shuffle(['tilt', 'center']));
    var idx = 0;
    var ui = layout(stage, '量法對嗎（動動腦）', '', '這樣量角，量法正確嗎？');
    function load() {
      var s = scenario(types[idx]);
      ui.prog.textContent = '課本 動動腦 印p36；習作 印p32 題型　第 ' + (idx + 1) + ' / ' + types.length + ' 題';
      drawScenario(ui.svg, s, 190);
      ui.inputs.innerHTML = ''; ui.btns.innerHTML = ''; UI.say(ui.msg, '');
      var reasonRow = h('div', { 'class': 'row', hidden: 'hidden' });
      var right = s.type === 'ok' || s.type === 'tilt';
      function done() { nextBtn(ui, idx === types.length - 1, api, function () { idx++; load(); }); }
      ui.inputs.appendChild(h('div', { 'class': 'row' }, [
        h('button', { 'class': 'btn', text: '正確', 'data-act': 'right', onclick: function () {
          if (right) { UI.say(ui.msg, '對！中心點對到頂點，0 線也壓在邊上。' + (s.type === 'tilt' ? '量角器斜斜的也可以。' : ''), 'ok'); done(); }
          else UI.say(ui.msg, '再檢查：中心點有對到頂點嗎？刻度 0 的線有壓在邊上嗎？', 'bad');
        } }),
        h('button', { 'class': 'btn', text: '不正確', 'data-act': 'wrong', onclick: function () {
          if (right) { UI.say(ui.msg, '再檢查：中心點對到頂點、0 線壓在邊上，就是正確的。' + (s.type === 'tilt' ? '量角器斜斜的也可以。' : ''), 'bad'); return; }
          reasonRow.hidden = false; UI.say(ui.msg, '哪裡不正確？', '');
        } })
      ]));
      REASONS.forEach(function (r) {
        reasonRow.appendChild(h('button', { 'class': 'btn', text: r[1], 'data-reason': r[0], onclick: function () {
          if (r[0] === s.type) { UI.say(ui.msg, '對！' + r[1] + '。', 'ok'); done(); }
          else if (r[0] === 'tilt') UI.say(ui.msg, '量角器斜斜的也可以，只要中心點對頂點、0 線壓在邊上。再看一次哪裡不對。', 'bad');
          else UI.say(ui.msg, '再看一次，' + r[1] + '嗎？', 'bad');
        } }));
      });
      ui.inputs.appendChild(reasonRow);
    }
    load();
  }

  // 關5 問9 印p40 定刻度點
  var MARK_MSG = {
    WRONG_RING: '你畫的角比直角大還是小？題目要的角呢？',
    AMBIGUOUS: '再看一次刻度，從 0 開始數。',
    OTHER: '從刻度 0 開始，順著那一圈數到題目的度數，再做記號。'
  };
  function renderMark(stage, api) {
    var targets = [{ t: 65, src: '課本 問9 印p40' }, { t: 70, src: '課本 問9 做做看 印p40' }, { t: 135, src: '課本 問9 做做看 印p40' }];
    while (targets.length < 6) { var t = rint(3, 34) * 5; if (C.isMarkTargetUsable(t)) targets.push({ t: t, src: '再練一題' }); }
    var idx = 0, R = 250, V = { x: 320, y: 400 };
    var ui = layout(stage, '畫角做記號（問9）', '', '');
    function load() {
      var tg = targets[idx];
      ui.prog.textContent = tg.src + '　第 ' + (idx + 1) + ' / ' + targets.length + ' 題';
      ui.q.textContent = '要畫出 ' + tg.t + '° 的角。量角器已經對好了（中心點對頂點、刻度 0 的線對齊這條邊）。在量角器上 ' + tg.t + '° 的地方點一下做記號。';
      AP.clear(ui.svg); ui.inputs.innerHTML = ''; ui.btns.innerHTML = ''; UI.say(ui.msg, '');
      var p = AP.drawProtractor(ui.svg, { r: R, style: 'L' }); AP.place(p, V.x, V.y, 0);
      drawEdge(ui.svg, V, 0, R + 40);
      var markG = AP.el('g', {}, ui.svg);
      var hit = AP.el('path', { d: 'M ' + (V.x - R - 20) + ' ' + V.y + ' A ' + (R + 20) + ' ' + (R + 20) + ' 0 0 1 ' + (V.x + R + 20) + ' ' + V.y + ' Z', fill: 'transparent', 'data-hit': 'arc', style: 'cursor:crosshair' }, ui.svg);
      var locked = false;
      hit.addEventListener('click', function (e) {
        if (locked) return;
        var q = AP.svgPoint(ui.svg, e);
        var m = Math.max(0, Math.min(180, Math.round(AP.angleAt(V.x, V.y, q.x, q.y))));
        AP.clear(markG);
        var dot = AP.pt(m, R + 6);
        AP.el('circle', { cx: V.x + dot.x, cy: V.y + dot.y, r: 7, fill: '#d32f2f' }, markG);
        drawEdge(markG, V, m, R + 40, 'ray2');
        var code = C.diagnoseMark({ markDeg: m, target: tg.t }).code;
        if (code === 'CORRECT') {
          locked = true;
          UI.say(ui.msg, '對！拿開量角器，把頂點和記號連成一直線，標上弧線和 ' + tg.t + '°。（課本容許 2 度以內的誤差）', 'ok');
          nextBtn(ui, idx === targets.length - 1, api, function () { idx++; load(); });
        } else {
          UI.say(ui.msg, MARK_MSG[code], 'bad');
        }
      });
    }
    load();
  }

  /* ================================================================
   * 🏆 挑戰
   * ============================================================== */
  (function () {
    var box = document.getElementById('chBox');
    var types = UI.shuffle(['ok', 'tilt', 'center', 'zero']);
    var answers = {};
    var grid = h('div', { style: 'display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px' });
    types.forEach(function (tp, i) {
      var s = scenario(tp);
      var svg = AP.el('svg', { viewBox: '60 20 520 400' });
      drawScenario(svg, s, 170);
      var board = h('div', { 'class': 'board' }); board.appendChild(svg);
      var bOk = h('button', { 'class': 'btn', text: '✓ 正確', 'data-ch': i + '-ok' });
      var bNo = h('button', { 'class': 'btn', text: '✗ 不正確', 'data-ch': i + '-no' });
      bOk.onclick = function () { answers[i] = true; bOk.classList.add('sel'); bNo.classList.remove('sel'); };
      bNo.onclick = function () { answers[i] = false; bNo.classList.add('sel'); bOk.classList.remove('sel'); };
      grid.appendChild(h('div', { 'class': 'side' }, [h('h2', { text: '第 ' + (i + 1) + ' 圖' }), board, h('div', { 'class': 'row' }, [bOk, bNo])]));
    });
    var msg = h('div', { 'class': 'msg' });
    box.appendChild(grid);
    box.appendChild(h('div', { 'class': 'row' }, [h('button', { 'class': 'btn primary', text: '對答案', 'data-act': 'grade', onclick: function () {
      var wrong = [];
      types.forEach(function (tp, i) { if (answers[i] !== (tp === 'ok' || tp === 'tilt')) wrong.push(i + 1); });
      if (Object.keys(answers).length < 4) { UI.say(msg, '四張圖都要選。', 'bad'); return; }
      UI.say(msg, wrong.length ? '第 ' + wrong.join('、') + ' 圖再檢查一次：中心點對頂點？0 線壓在邊上？斜斜放是可以的。' : '全對！', wrong.length ? 'bad' : 'ok');
    } })]));
    box.appendChild(msg);
  })();

  UI.tabs();
  showExplore(0);
})();
</script>
</body>
