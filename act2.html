<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>活動二　測量角的大小和畫角</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>活動二　測量角的大小和畫角</h1>
    <span class="src">課本 印 p36–40</span>
    <a class="home" href="index.html">← 回首頁</a>
  </header>

  <div class="tabs">
    <button data-tab="explore">🔍 探索</button>
    <button data-tab="practice">✏️ 練習</button>
    <button data-tab="challenge">🏆 挑戰</button>
  </div>

  <section data-panel="explore">
    <div class="physical">網頁練完，課堂要用真的量角器再量一次。網頁上擺得好，不代表真的量角器也會擺。</div>
    <div class="levels" id="exNav"></div>
    <div class="stage">
      <div class="board"><svg id="exSvg" viewBox="0 0 640 480"></svg></div>
      <div class="side">
        <h2 id="exTitle"></h2>
        <div class="q" id="exText"></div>
        <div id="exCtrl"></div>
        <div class="msg" id="exMsg"></div>
      </div>
    </div>
  </section>

  <section data-panel="practice">
    <div class="levels" id="lvNav"></div>
    <div id="lvStage"></div>
  </section>

  <section data-panel="challenge">
    <p class="warn">擺法判斷挑戰：題型改寫自習作 印p32 第 1 題，擺法由系統產生，<b>不是原題</b>。</p>
    <div id="chBox"></div>
  </section>
</div>

<script src="angle-core.js"></script>
<script src="protractor.js"></script>
<script src="ui.js"></script>
<script>
(function () {
  'use strict';
  var C = window.AngleCore, h = UI.h;
  var VB = '0 0 640 480';

  var MSG = {
    CORRECT: '答對了！',
    WRONG_RING: '這個角比直角（90°）大還是小？再看看角的一邊壓在哪一圈的 0。',
    NEAR_MISS: '差一點點，一小格一小格數。',
    AMBIGUOUS: '再數一次，從 0 開始數到另一條邊。',
    OTHER: '從刻度 0 開始，數到角的另一邊為止。',
    CENTER_OFF: '量角器的中心點還沒對到角的頂點。',
    ZERO_LINE_OFF: '刻度 0 的線還沒壓在角的一條邊上。轉動外面的圓環，或按 ◀1°、1°▶。',
    ANGLE_OUTSIDE: '0 線對到邊了，但角沒有被量角器蓋住。量角器要蓋在角的裡面，轉過來試試。',
    SHORT: '0 線對好了，可是角的邊太短，看不到刻度。把邊拉長一點。'
  };

  function rint(lo, hi) { return lo + Math.floor(Math.random() * (hi - lo + 1)); }
  function kind(c) { return c < 90 ? '銳角' : (c === 90 ? '直角' : '鈍角'); }
  function animate(ms, step, done) {
    var t0 = null;
    function f(t) { if (t0 === null) t0 = t; var k = Math.min(1, (t - t0) / ms); step(k); if (k < 1) requestAnimationFrame(f); else if (done) done(); }
    requestAnimationFrame(f);
  }
  function endPoint(V, dir, len) { var p = AP.pt(dir, len); return { x: V.x + p.x, y: V.y + p.y }; }
  function drawEdge(g, V, dir, len, cls) {
    var e = endPoint(V, dir, len);
    return AP.el('line', { x1: V.x, y1: V.y, x2: e.x, y2: e.y, 'class': cls || 'ray' }, g);
  }
  function setEdge(line, V, dir, len) { var e = endPoint(V, dir, len); line.setAttribute('x2', e.x); line.setAttribute('y2', e.y); }

  /* ================================================================
   * 🔍 探索
   * ============================================================== */
  var exSvg = document.getElementById('exSvg');
  var exTitle = document.getElementById('exTitle'), exText = document.getElementById('exText');
  var exCtrl = document.getElementById('exCtrl'), exMsg = document.getElementById('exMsg');
  var exNav = document.getElementById('exNav');
  var EXPLORE = [
    { id: 'e1', label: '測量三步驟（問1）', run: exSteps },
    { id: 'e2', label: '邊太短（問2）', run: exShort },
    { id: 'e3', label: '奇奇和妙妙（動動腦）', run: exQiqi },
    { id: 'e4', label: '平角（問7）', run: exStraight }
  ];
  EXPLORE.forEach(function (e, i) {
    exNav.appendChild(h('button', { text: e.label, 'data-ex': e.id, onclick: function () { showExplore(i); } }));
  });
  function showExplore(i) {
    Array.prototype.forEach.call(exNav.children, function (b, j) { b.classList.toggle('on', i === j); });
    AP.clear(exSvg); exSvg.setAttribute('viewBox', VB);
    exCtrl.innerHTML = ''; UI.say(exMsg, '');
    EXPLORE[i].run();
  }

  // E1 問1 印p36：隨機角度、隨機方向（無限換題），相同三步驟
  // 步驟文字照課本 印p36；步驟②另加「角要包含在量角器裡面」與「只對齊一邊的兩種狀況」例子
  var STEP_TEXT = [
    '① 把量角器的中心點對齊角的頂點。',
    '② 將刻度 0 的線，對齊角的一邊。角要包含在量角器裡面。',
    '③ 從刻度 0 開始，數到角的另一邊為止。'
  ];
  var STEP_CAPTION = ['步驟①　中心點對齊頂點', '步驟②　0 的線對齊一邊，角在量角器裡面', '步驟③　從 0 數到另一邊'];
  var RING_NAME2 = { inner: '紅字那一圈（內圈）', outer: '黑字那一圈（外圈）' };

  function exSteps() {
    exTitle.textContent = '要怎麼用量角器量出這個角是幾度？';
    exText.textContent = '課本 問1 印p36 的三個步驟。按「換一個角」，角的大小和方向都會不一樣，一樣照三個步驟量。';
    var R = 170, V, c, e1, e2, alignEdge, rotOK, ring, st, prot, caption, busy = false;

    var stepBox = h('ul', { style: 'list-style:none;padding:0;margin:8px 0' });
    STEP_TEXT.forEach(function () {
      stepBox.appendChild(h('li', { style: 'padding:6px 10px;border-radius:10px;line-height:1.6;margin:2px 0' }));
    });
    function setStep(n) { // n：目前在第幾步（1～3）；4＝三步都完成
      Array.prototype.forEach.call(stepBox.children, function (li, i) {
        var k = i + 1;
        li.style.fontWeight = k === n ? '700' : '400';
        li.style.background = k === n ? '#e0f2f1' : 'transparent';
        li.style.color = k < n ? '#2e7d32' : '#263238';
        li.textContent = (k < n ? '✓ ' : '') + STEP_TEXT[i];
      });
      caption.textContent = n >= 1 && n <= 3 ? STEP_CAPTION[n - 1] : (n === 4 ? '量好了！' : '');
    }

    function place() { AP.place(prot, st.cx, st.cy, st.rot); }
    function run(fn) { if (busy) return false; busy = true; fn(function () { busy = false; }); return true; }
    function moveTo(x, y, ms, done) {
      var x0 = st.cx, y0 = st.cy;
      animate(ms, function (k) { st.cx = x0 + (x - x0) * k; st.cy = y0 + (y - y0) * k; place(); }, done);
    }
    function rotTo(r, ms, done) {
      var r0 = st.rot, d = ((r - r0) % 360 + 540) % 360 - 180; // 走最短的方向轉
      animate(ms, function (k) { st.rot = r0 + d * k; place(); }, function () { st.rot = AP.norm360(r); place(); if (done) done(); });
    }
    function clearLit() {
      Array.prototype.forEach.call(prot.querySelectorAll('.pr-lit, [data-lit]'), function (n) { n.remove(); });
    }

    var b1 = h('button', { 'class': 'btn primary', text: '步驟①', 'data-act': 'step1', onclick: function () {
      run(function (done) {
        b1.disabled = true; setStep(1);
        UI.say(exMsg, STEP_TEXT[0] + '量角器底邊中間的小黑點就是中心點。', 'ok');
        moveTo(V.x, V.y, 900, function () { b2.disabled = false; setStep(2); done(); });
      });
    } });
    var b2 = h('button', { 'class': 'btn primary', text: '步驟②', 'data-act': 'step2', disabled: 'disabled', onclick: function () {
      run(function (done) {
        b2.disabled = true;
        UI.say(exMsg, STEP_TEXT[1] + '刻度 0 的線壓在角的一條邊上，而且整個角都被量角器蓋住。', 'ok');
        rotTo(rotOK, 900, function () { b3.disabled = false; caseRow.hidden = false; done(); });
      });
    } });
    var b3 = h('button', { 'class': 'btn primary', text: '步驟③', 'data-act': 'step3', disabled: 'disabled', onclick: function () {
      run(function (done) {
        b3.disabled = true; caseRow.hidden = true; clearLit(); setStep(3);
        rotTo(rotOK, 400, function () {
          var t0 = alignEdge === 1 ? 0 : 180, t1 = alignEdge === 1 ? c : 180 - c;
          var w = AP.wedge(prot, 0, 0, Math.min(t0, t1), Math.max(t0, t1), R * 0.95, 'wedge');
          w.setAttribute('transform', ''); w.setAttribute('data-lit', '1'); w.style.fill = 'rgba(255, 213, 79, .35)';
          AP.highlightLabel(prot, ring, t0); AP.highlightLabel(prot, ring, t1);
          UI.say(exMsg, STEP_TEXT[2] + '這條邊壓在' + RING_NAME2[ring] + '的 0，從 0 數到另一條邊是 ' + c + '，所以這個角是 ' + c + '°，是' + kind(c) + '。', 'ok');
          setStep(4); done();
        });
      });
    } });

    var bCase1 = h('button', { 'class': 'btn', text: '狀況一：角在量角器裡面', 'data-act': 'case-in', onclick: function () {
      run(function (done) {
        clearLit();
        UI.say(exMsg, '狀況一：刻度 0 的線對齊角的一邊，量角器蓋住整個角，另一條邊碰得到刻度，可以讀出角度。✓ 這樣才對。', 'ok');
        rotTo(rotOK, 700, done);
      });
    } });
    var bCase2 = h('button', { 'class': 'btn', text: '狀況二：角在量角器外面', 'data-act': 'case-out', onclick: function () {
      run(function (done) {
        clearLit();
        UI.say(exMsg, '狀況二：刻度 0 的線一樣對齊同一條邊，但量角器轉到另一邊，角沒有被蓋住，另一條邊碰不到刻度，讀不出角度。✗ 要把量角器轉回來，讓角包含在量角器裡面。', 'bad');
        rotTo(rotOK + 180, 700, done);
      });
    } });
    var caseRow = h('div', { hidden: 'hidden', 'data-row': 'cases' }, [
      h('div', { 'class': 'q', text: '例子：刻度 0 的線只對齊角的一邊，會有兩種狀況：' }),
      h('div', { 'class': 'row' }, [bCase1, bCase2])
    ]);

    function newAngle() {
      if (busy) return;
      AP.clear(exSvg); exSvg.setAttribute('viewBox', VB);
      c = (2 + Math.floor(Math.random() * 15)) * 10;             // 20°～160°，整十（刻度標示看得清楚）
      e1 = Math.floor(Math.random() * 360); e2 = e1 + c;          // 方向隨機
      V = { x: 320 + Math.round(Math.random() * 60 - 30), y: 250 + Math.round(Math.random() * 40 - 20) };
      // 隨機決定 0 的線對齊哪一條邊：對齊 e1 用量角器 θ=0 那端，對齊 e2 用 θ=180 那端
      alignEdge = Math.random() < 0.5 ? 1 : 2;
      rotOK = alignEdge === 1 ? AP.norm360(e1) : AP.norm360(e2 - 180);
      ring = C.ringReading(alignEdge === 1 ? 0 : 180, 'L', 'inner') === 0 ? 'inner' : 'outer';

      var ang = AP.el('g', {}, exSvg);
      AP.wedge(ang, V.x, V.y, e1, e2, 36, 'wedge');
      drawEdge(ang, V, e1, 215); drawEdge(ang, V, e2, 215);
      AP.el('circle', { cx: V.x, cy: V.y, r: 5, fill: '#1e88e5' }, ang);
      prot = AP.drawProtractor(exSvg, { r: R, style: 'L' });
      st = { cx: 110, cy: 440, rot: 0 };
      place();
      caption = AP.el('text', { x: 16, y: 34, 'font-size': 22, fill: '#00695c', 'font-weight': 700 }, exSvg);

      b1.disabled = false; b2.disabled = true; b3.disabled = true; caseRow.hidden = true;
      setStep(1);
      UI.say(exMsg, '按「步驟①」開始。');
    }

    exCtrl.appendChild(stepBox);
    exCtrl.appendChild(h('div', { 'class': 'row' }, [b1, b2, b3]));
    exCtrl.appendChild(caseRow);
    exCtrl.appendChild(h('div', { 'class': 'row' }, [
      h('button', { 'class': 'btn', text: '換一個角', 'data-act': 'new-angle', onclick: newAngle })
    ]));
    newAngle();
  }

  // E2 問2 印p36
  function exShort() {
    exTitle.textContent = '角的邊不夠長怎麼辦？';
    exText.textContent = '拖動兩條邊的端點，把邊延長。延長以後，角的大小會改變嗎？';
    var V = { x: 320, y: 420 }, R = 240, a = 0, b = 120, la = 60, lb = 60;
    var prot = AP.drawProtractor(exSvg, { r: R, style: 'L' }); AP.place(prot, V.x, V.y, 0);
    var g = AP.el('g', {}, exSvg);
    AP.wedge(g, V.x, V.y, a, b, 30, 'wedge');
    var ea = drawEdge(g, V, a, la), eb = drawEdge(g, V, b, lb);
    var ha = AP.el('circle', { r: 22, 'class': 'handle' }, exSvg), hb = AP.el('circle', { r: 22, 'class': 'handle' }, exSvg);
    var lit = [];
    function proj(p, dir) { var u = AP.pt(dir, 1); return (p.x - V.x) * u.x + (p.y - V.y) * u.y; }
    function upd() {
      setEdge(ea, V, a, la); setEdge(eb, V, b, lb);
      var pa = endPoint(V, a, la), pb = endPoint(V, b, lb);
      ha.setAttribute('cx', pa.x); ha.setAttribute('cy', pa.y); hb.setAttribute('cx', pb.x); hb.setAttribute('cy', pb.y);
      lit.forEach(function (n) { n.remove(); }); lit = [];
      if (lb > R * 0.62) {
        lit.push(AP.highlightLabel(prot, 'inner', 0), AP.highlightLabel(prot, 'inner', b));
        UI.say(exMsg, '看得到刻度了：從紅字那一圈的 0 數到 120。角的大小還是 120°，延長邊不會改變角的大小。', 'ok');
      } else {
        UI.say(exMsg, '邊太短了，看不到刻度。角的大小是 120°。', '');
      }
    }
    AP.drag(exSvg, ha, { move: function (p) { la = Math.max(60, Math.min(300, proj(p, a))); upd(); } });
    AP.drag(exSvg, hb, { move: function (p) { lb = Math.max(60, Math.min(300, proj(p, b))); upd(); } });
    upd();
  }

  // E3 動動腦 印p36
  function exQiqi() {
    exTitle.textContent = '奇奇和妙妙的量法正確嗎？';
    exText.textContent = '按「檢查中心點」和「檢查 0 線」，看看兩個人哪裡對、哪裡不對。';
    var R = 130;
    var Q = { cx: 150, cy: 330, V: { x: 210, y: 330 }, rot: 0, base: 180, other: 145 };
    var M = { cx: 480, cy: 330, V: { x: 480, y: 330 }, rot: 12, base: 12, other: 50 };
    [Q, M].forEach(function (s, i) {
      var t = AP.el('text', { x: s.cx - 40, y: 120, 'font-size': 26 }, exSvg); t.textContent = i ? '妙妙' : '奇奇';
      var p = AP.drawProtractor(exSvg, { r: R, style: 'L' }); AP.place(p, s.cx, s.cy, s.rot);
      drawEdge(exSvg, s.V, s.base, 200); drawEdge(exSvg, s.V, s.other, 200);
    });
    var marks = AP.el('g', {}, exSvg);
    exCtrl.appendChild(h('div', { 'class': 'row' }, [
      h('button', { 'class': 'btn', text: '檢查中心點', onclick: function () {
        AP.clear(marks);
        [Q, M].forEach(function (s) {
          AP.el('circle', { cx: s.cx, cy: s.cy, r: 9, fill: '#f9a825' }, marks);
          AP.el('circle', { cx: s.V.x, cy: s.V.y, r: 14, fill: 'none', stroke: s.cx === s.V.x ? '#2e7d32' : '#c62828', 'stroke-width': 4 }, marks);
        });
        UI.say(exMsg, '奇奇：中心點（黃點）沒有對到角的頂點（紅圈），量法不正確。妙妙：中心點對到頂點了。', 'ok');
      } }),
      h('button', { 'class': 'btn', text: '檢查 0 線', onclick: function () {
        AP.clear(marks);
        [Q, M].forEach(function (s) {
          var a = AP.pt(s.rot, R), b = AP.pt(s.rot + 180, R);
          AP.el('line', { x1: s.cx + a.x, y1: s.cy + a.y, x2: s.cx + b.x, y2: s.cy + b.y, stroke: '#f9a825', 'stroke-width': 6, opacity: .8 }, marks);
        });
        UI.say(exMsg, '妙妙的量角器斜斜的，可是刻度 0 的線壓在角的一條邊上，中心點也對到頂點，所以妙妙量法正確。斜斜放也可以。', 'ok');
      } })
    ]));
  }

  // E4 問7 印p39
  function exStraight() {
    exTitle.textContent = '下圖中的角是多少度？';
    exText.textContent = '藍色邊不動，拖動紅色邊慢慢張開，現在這個角是多少度呢？';
    var V = { x: 320, y: 400 }, R = 250, red = 150;
    var prot = AP.drawProtractor(exSvg, { r: R, style: 'L' }); AP.place(prot, V.x, V.y, 0);
    var w = AP.wedge(exSvg, V.x, V.y, red, 180, 50, 'wedge');
    drawEdge(exSvg, V, 180, 300, 'ray');
    var redL = drawEdge(exSvg, V, red, 300, 'ray2');
    var hd = AP.el('circle', { r: 26, 'class': 'handle' }, exSvg);
    function upd() {
      setEdge(redL, V, red, 300); AP.setWedge(w, red, 180, 50);
      var e = endPoint(V, red, 280); hd.setAttribute('cx', e.x); hd.setAttribute('cy', e.y);
      var c = 180 - red;
      var t = '這個角是 ' + c + '°';
      if (c === 90) t += '，是直角。';
      else if (c === 180) t += '。藍色邊和紅色邊成一直線，它是一個平平的角，我們稱它是平角。';
      else t += '。';
      UI.say(exMsg, t, 'ok');
    }
    AP.drag(exSvg, hd, { move: function (p) {
      var t = p.y > V.y ? (p.x < V.x ? 180 : 0) : Math.round(AP.angleAt(V.x, V.y, p.x, p.y));
      if (Math.abs(t - 90) <= 2) t = 90;
      if (t <= 2) t = 0;
      red = Math.max(0, Math.min(180, t)); upd();
    } });
    upd();
  }

  /* ================================================================
   * ✏️ 練習
   * ============================================================== */
  var LEVELS = [
    { id: 'l1', label: '估一估（問5）', render: renderEstimate },
    { id: 'l2', label: '自己量（問1）', render: function (s, api) { renderMeasure(s, api, false); } },
    { id: 'l3', label: '邊太短（問2）', render: function (s, api) { renderMeasure(s, api, true); } },
    { id: 'c3', label: '附件7（問3）', card: { id: 'act2-q3', src: '課本 問3 印p36', title: '拿出附件 7 的 4 個角，量量看，各是幾度？', text: '請用<b>真的量角器</b>量。附件上角的度數課本沒有印出來，網頁沒辦法幫你對答案，請和同學互相檢查。' } },
    { id: 'l4', label: '量法對嗎（動動腦）', render: renderJudge },
    // 問4 印p37：照課本圖顯示兩個三角板與 ∠1～∠6，一次亮一個角，學生實測後填答
    { id: 'l-sq', label: '三角板6個角（問4）', render: function renderSetSquares(stage, api) {
      var ui = layout(stage, '三角板 6 個角（問4）', '課本 問4 印p37（附件6、8）', '');
      var svg = ui.svg;
      // 課本圖（220dpi 核對）：左 30-60-90、右 45-45-90
      // x,y＝頂點；a1→a2＝角的兩邊方向（數學角，逆時針）；deg＝標準答案；bx,by＝答案方框中心
      var ANG = [
        { n: 1, x: 90,  y: 170, a1: -30, a2: 0,   deg: 30, bx: 48,  by: 150 },
        { n: 2, x: 310, y: 297, a1: 90,  a2: 150, deg: 60, bx: 330, by: 332 },
        { n: 3, x: 310, y: 170, a1: 180, a2: 270, deg: 90, bx: 352, by: 140 },
        { n: 4, x: 390, y: 380, a1: 0,   a2: 45,  deg: 45, bx: 350, by: 414 },
        { n: 5, x: 550, y: 380, a1: 90,  a2: 180, deg: 90, bx: 596, by: 414 },
        { n: 6, x: 550, y: 220, a1: 225, a2: 270, deg: 45, bx: 596, by: 196 }
      ];
      function tri(pts) {

  // 關2、3 自己擺量角器
  function renderMeasure(stage, api, short) {

      var baseLine = prot.querySelector('.pr-base');
      var ends = [], hdl = [];

        [0, 1].forEach(function (i) {
          var hc = AP.el('circle', { r: 20, 'class': 'handle' }, ui.svg);
          hdl.push(hc);
          AP.drag(ui.svg, hc, { move: function (p) {
            var dir = i ? e2 : e1, u = AP.pt(dir, 1);
            len[i] = Math.max(70, Math.min(300, (p.x - V.x) * u.x + (p.y - V.y) * u.y));
            placeEnds(); check();
          } });
        });
      }
      function placeEnds() {
        setEdge(l1, V, e1, len[0]); setEdge(l2, V, e2, len[1]);
        hdl.forEach(function (hc, i) { var e = endPoint(V, i ? e2 : e1, len[i]); hc.setAttribute('cx', e.x); hc.setAttribute('cy', e.y); });
      }

      ui.inputs.appendChild(h('div', { 'class': 'row' }, [rotL, rotR]));
      ui.inputs.appendChild(h('div', { 'class': 'row' }, [inp, h('span', { text: '度' })]));

      ui.btns.appendChild(h('button', { 'class': 'btn', text: '重擺', 'data-act': 'reset', onclick: function () {

        end: function () {

      var reasonRow = h('div', { 'class': 'row', hidden: 'hidden' });
      var right = s.type === 'ok' || s.type === 'tilt';
      function done() { nextBtn(ui, idx === types.length - 1, api, function () { idx++; load(); }); }
      ui.inputs.appendChild(h('div', { 'class': 'row' }, [
        h('button', { 'class': 'btn', text: '正確', 'data-act': 'right', onclick: function () {
          if (right) { UI.say(ui.msg, '對！中心點對到頂點，0 線也壓在邊上。' + (s.type === 'tilt' ? '量角器斜斜的也可以。' : ''), 'ok'); done(); }
          else UI.say(ui.msg, '再檢查：中心點有對到頂點嗎？刻度 0 的線有壓在邊上嗎？', 'bad');
        } }),
        h('button', { 'class': 'btn', text: '不正確', 'data-act': 'wrong', onclick: function () {
          if (right) { UI.say(ui.msg, '再檢查：中心點對到頂點、0 線壓在邊上，就是正確的。' + (s.type === 'tilt' ? '量角器斜斜的也可以。' : ''), 'bad'); return; }
          reasonRow.hidden = false; UI.say(ui.msg, '哪裡不正確？', '');
        } })
      ]));
      REASONS.forEach(function (r) {
        reasonRow.appendChild(h('button', { 'class': 'btn', text: r[1], 'data-reason': r[0], onclick: function () {
          if (r[0] === s.type) { UI.say(ui.msg, '對！' + r[1] + '。', 'ok'); done(); }
          else if (r[0] === 'tilt') UI.say(ui.msg, '量角器斜斜的也可以，只要中心點對頂點、0 線壓在邊上。再看一次哪裡不對。', 'bad');
          else UI.say(ui.msg, '再看一次，' + r[1] + '嗎？', 'bad');
        } }));
      });
      ui.inputs.appendChild(reasonRow);
    }
    load();
  }

  // 關5 問9 印p40 定刻度點
  var MARK_MSG = {
    WRONG_RING: '你畫的角比直角大還是小？題目要的角呢？',
    AMBIGUOUS: '再看一次刻度，從 0 開始數。',
    OTHER: '從刻度 0 開始，順著那一圈數到題目的度數，再做記號。'
  };
  function renderMark(stage, api) {
    var targets = [{ t: 65, src: '課本 問9 印p40' }, { t: 70, src: '課本 問9 做做看 印p40' }, { t: 135, src: '課本 問9 做做看 印p40' }];
    while (targets.length < 6) { var t = rint(3, 34) * 5; if (C.isMarkTargetUsable(t)) targets.push({ t: t, src: '再練一題' }); }
    var idx = 0, R = 250, V = { x: 320, y: 400 };
    var ui = layout(stage, '畫角做記號（問9）', '', '');
    function load() {
      var tg = targets[idx];
      ui.prog.textContent = tg.src + '　第 ' + (idx + 1) + ' / ' + targets.length + ' 題';
      ui.q.textContent = '要畫出 ' + tg.t + '° 的角。量角器已經對好了（中心點對頂點、刻度 0 的線對齊這條邊）。在量角器上 ' + tg.t + '° 的地方點一下做記號。';
      AP.clear(ui.svg); ui.inputs.innerHTML = ''; ui.btns.innerHTML = ''; UI.say(ui.msg, '');
      var p = AP.drawProtractor(ui.svg, { r: R, style: 'L' }); AP.place(p, V.x, V.y, 0);
      drawEdge(ui.svg, V, 0, R + 40);
      var markG = AP.el('g', {}, ui.svg);
      var hit = AP.el('path', { d: 'M ' + (V.x - R - 20) + ' ' + V.y + ' A ' + (R + 20) + ' ' + (R + 20) + ' 0 0 1 ' + (V.x + R + 20) + ' ' + V.y + ' Z', fill: 'transparent', 'data-hit': 'arc', style: 'cursor:crosshair' }, ui.svg);
      var locked = false;
      hit.addEventListener('click', function (e) {
        if (locked) return;
        var q = AP.svgPoint(ui.svg, e);
        var m = Math.max(0, Math.min(180, Math.round(AP.angleAt(V.x, V.y, q.x, q.y))));
        AP.clear(markG);
        var dot = AP.pt(m, R + 6);
        AP.el('circle', { cx: V.x + dot.x, cy: V.y + dot.y, r: 7, fill: '#d32f2f' }, markG);
        drawEdge(markG, V, m, R + 40, 'ray2');
        var code = C.diagnoseMark({ markDeg: m, target: tg.t }).code;
        if (code === 'CORRECT') {
          locked = true;
          UI.say(ui.msg, '對！拿開量角器，把頂點和記號連成一直線，標上弧線和 ' + tg.t + '°。（課本容許 2 度以內的誤差）', 'ok');
          nextBtn(ui, idx === targets.length - 1, api, function () { idx++; load(); });
        } else {
          UI.say(ui.msg, MARK_MSG[code], 'bad');
        }
      });
    }
    load();
  }

  /* ================================================================
   * 🏆 挑戰
   * ============================================================== */
  (function () {
    var box = document.getElementById('chBox');
    var types = UI.shuffle(['ok', 'tilt', 'center', 'zero']);
    var answers = {};
    var grid = h('div', { style: 'display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px' });
    types.forEach(function (tp, i) {
      var s = scenario(tp);
      var svg = AP.el('svg', { viewBox: '60 20 520 400' });
      drawScenario(svg, s, 170);
      var board = h('div', { 'class': 'board' }); board.appendChild(svg);
      var bOk = h('button', { 'class': 'btn', text: '✓ 正確', 'data-ch': i + '-ok' });
      var bNo = h('button', { 'class': 'btn', text: '✗ 不正確', 'data-ch': i + '-no' });
      bOk.onclick = function () { answers[i] = true; bOk.classList.add('sel'); bNo.classList.remove('sel'); };
      bNo.onclick = function () { answers[i] = false; bNo.classList.add('sel'); bOk.classList.remove('sel'); };
      grid.appendChild(h('div', { 'class': 'side' }, [h('h2', { text: '第 ' + (i + 1) + ' 圖' }), board, h('div', { 'class': 'row' }, [bOk, bNo])]));
    });
    var msg = h('div', { 'class': 'msg' });
    box.appendChild(grid);
    box.appendChild(h('div', { 'class': 'row' }, [h('button', { 'class': 'btn primary', text: '對答案', 'data-act': 'grade', onclick: function () {
      var wrong = [];
      types.forEach(function (tp, i) { if (answers[i] !== (tp === 'ok' || tp === 'tilt')) wrong.push(i + 1); });
      if (Object.keys(answers).length < 4) { UI.say(msg, '四張圖都要選。', 'bad'); return; }
      UI.say(msg, wrong.length ? '第 ' + wrong.join('、') + ' 圖再檢查一次：中心點對頂點？0 線壓在邊上？斜斜放是可以的。' : '全對！', wrong.length ? 'bad' : 'ok');
    } })]));
    box.appendChild(msg);
  })();

  UI.tabs();
  showExplore(0);
})();
</script>
</body>
</html>
