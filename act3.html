<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>活動三　旋轉角</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>活動三　旋轉角</h1>
    <span class="src">課本 印 p41–43；練習百分百（三）第 2 題 印 p46；習作 印 p36–37、p41</span>
    <a class="home" href="index.html">← 回首頁</a>
  </header>

  <div class="tabs">
    <button data-tab="explore">🔍 探索</button>
    <button data-tab="practice">✏️ 練習</button>
    <button data-tab="challenge">🏆 挑戰</button>
  </div>

  <section data-panel="explore">
    <div class="physical">課本要拿附件的鐘面和鉛筆實際轉轉看。網頁練完，課堂上再用真的鐘面操作一次。</div>
    <div class="levels" id="exNav"></div>
    <div class="stage">
      <div class="board"><svg id="exSvg" viewBox="0 0 640 480"></svg></div>
      <div class="side">
        <h2 id="exTitle"></h2>
        <div class="q" id="exText"></div>
        <div id="exCtrl"></div>
        <div class="msg" id="exMsg"></div>
      </div>
    </div>
  </section>

  <section data-panel="practice">
    <div class="levels" id="lvNav"></div>
    <div id="lvStage"></div>
  </section>

  <section data-panel="challenge">
    <div id="chBox"></div>
  </section>
</div>

<script src="angle-core.js"></script>
<script src="protractor.js"></script>
<script src="ui.js"></script>
<script>
(function () {
  'use strict';
  var C = window.AngleCore, h = UI.h;
  var VB = '0 0 640 480';
  var DIR = { cw: '順時針', ccw: '逆時針' };
  var RING = { outer: '外圈（黑字）', inner: '內圈（紅字）' };

  function rint(lo, hi) { return lo + Math.floor(Math.random() * (hi - lo + 1)); }
  function animate(ms, step, done) {
    var t0 = null;
    function f(t) {
      if (t0 === null) t0 = t;
      var k = Math.min(1, (t - t0) / ms);
      step(k);
      if (k < 1) requestAnimationFrame(f);
      else if (done) done();
    }
    requestAnimationFrame(f);
  }

  function addArrowDefs(svg, color) {
    color = color || '#d32f2f';
    var defs = svg.querySelector('defs');
    if (!defs) defs = AP.el('defs', {}, svg);
    var hex = color.replace('#', '');
    var uid = (svg.id ? svg.id : 'ap') + '-arrow-' + hex;
    var existing = svg.querySelector('#' + uid);
    if (existing) return uid;
    var m = AP.el('marker', { id: uid, viewBox: '0 0 10 10', refX: 5, refY: 5, markerWidth: 6, markerHeight: 6, orient: 'auto-start-reverse' }, defs);
    AP.el('path', { d: 'M 0 0 L 10 5 L 0 10 z', fill: color }, m);
    return uid;
  }

  /* 畫一個鐘面題：從 from 轉到 to（方向 dir），回傳 group */
  function drawClockTurn(svg, cx, cy, r, from, to, dir, opt) {
    opt = opt || {};
    var color = opt.color || (dir === 'ccw' ? '#1565c0' : '#d32f2f');
    var arrowId = addArrowDefs(svg, color);
    var g = AP.drawClock(svg, cx, cy, r);
    var s = AP.pt(AP.numberAngle(from), r * 0.62);
    AP.el('line', { x1: 0, y1: 0, x2: s.x, y2: s.y, 'class': 'clock-start' }, g);
    var steps = C.clockTurn(from, to, dir).steps;
    if (!opt.noArc) {
      var cls = 'turn-arc' + (dir === 'ccw' ? ' turn-arc-ccw' : '');
      var arcAttrs = {
        d: AP.clockArcPath(from, dir, steps, opt.arcRadius || (r * 0.36)),
        'class': cls,
        'marker-end': 'url(#' + arrowId + ')'
      };
      if (color) arcAttrs.style = 'stroke: ' + color + ';';
      AP.el('path', arcAttrs, g);
    }
    var e = AP.pt(AP.numberAngle(to), r * 0.62);
    var hand = AP.el('line', { x1: 0, y1: 0, x2: e.x, y2: e.y, 'class': 'clock-hand' }, g);
    g.hand = hand; g.r = r; g.arrowId = arrowId;
    return g;
  }

  /* ================================================================
   * 🔍 探索
   * ============================================================== */
  var exSvg = document.getElementById('exSvg');
  var exTitle = document.getElementById('exTitle'), exText = document.getElementById('exText');
  var exCtrl = document.getElementById('exCtrl'), exMsg = document.getElementById('exMsg');
  var exNav = document.getElementById('exNav');
  var EXPLORE = [
    { id: 'e1', label: '鐘面指針（問1–2）', run: exHand },
    { id: 'e2', label: '一大格 30°（問3–4）', run: exStep },
    { id: 'e3', label: '兩個方向（問5）', run: exBoth },
    { id: 'e4', label: '大於 180° 的角', run: exBig }
  ];
  EXPLORE.forEach(function (e, i) {
    exNav.appendChild(h('button', { text: e.label, 'data-ex': e.id, onclick: function () { showExplore(i); } }));
  });
  function showExplore(i) {
    Array.prototype.forEach.call(exNav.children, function (b, j) { b.classList.toggle('on', i === j); });
    AP.clear(exSvg); exSvg.setAttribute('viewBox', VB);
    exCtrl.innerHTML = ''; UI.say(exMsg, '');
    EXPLORE[i].run();
  }

  // E1 問1–2 印p41
  function exHand() {
    exTitle.textContent = '指針是怎麼轉動的？';
    exText.textContent = '拖動紅色指針轉轉看。旋轉時，固定不動的地方叫做旋轉中心；轉出來的角叫做旋轉角。';
    var cx = 320, cy = 240, r = 200, start = 12;
    var arrowId = addArrowDefs(exSvg);
    var g, hand, arc, acc = 0, last = null;
    function build() {
      AP.clear(exSvg); arrowId = addArrowDefs(exSvg);
      g = AP.drawClock(exSvg, cx, cy, r);
      var s = AP.pt(AP.numberAngle(start), r * 0.62);
      AP.el('line', { x1: 0, y1: 0, x2: s.x, y2: s.y, 'class': 'clock-start' }, g);
      arc = AP.el('path', { d: '', 'class': 'turn-arc', 'marker-end': 'url(#' + arrowId + ')' }, g);
      hand = AP.el('line', { x1: 0, y1: 0, x2: s.x, y2: s.y, 'class': 'clock-hand' }, g);
      var lbl = AP.el('text', { x: 12, y: 30, 'font-size': 16, fill: '#1565c0' }, g); lbl.textContent = '旋轉中心';
      var hit = AP.el('circle', { cx: cx, cy: cy, r: r, fill: 'transparent' }, exSvg);
      acc = 0; last = null;
      AP.drag(exSvg, hit, {
        start: function (p) { last = AP.angleAt(cx, cy, p.x, p.y); },
        move: function (p) {
          var a = AP.angleAt(cx, cy, p.x, p.y), d = a - last;
          if (d > 180) d -= 360; if (d < -180) d += 360;
          acc = Math.max(-360, Math.min(360, acc + d)); last = a; draw(acc);
        },
        end: function () { acc = Math.round(acc / 30) * 30; draw(acc); }
      });
      draw(0);
    }
    function draw(a) {
      var t = AP.numberAngle(start) + a, e = AP.pt(t, r * 0.62);
      hand.setAttribute('x2', e.x); hand.setAttribute('y2', e.y);
      if (Math.abs(a) < 1) { arc.setAttribute('d', ''); UI.say(exMsg, '指針還沒轉。'); return; }
      var span = Math.abs(a) >= 360 ? (a > 0 ? 359.5 : -359.5) : a;
      arc.setAttribute('d', AP.arcPath(AP.numberAngle(start), AP.numberAngle(start) + span, r * 0.36));
      var dir = a < 0 ? 'cw' : 'ccw', deg = Math.round(Math.abs(a));
      var col = dir === 'ccw' ? '#1565c0' : '#d32f2f';
      var aid = addArrowDefs(exSvg, col);
      arc.setAttribute('marker-end', 'url(#' + aid + ')');
      arc.setAttribute('class', 'turn-arc' + (dir === 'ccw' ? ' turn-arc-ccw' : ''));
      arc.style.stroke = col;
      var text = '往' + DIR[dir] + '方向旋轉' + (deg % 30 === 0 ? '，轉了 ' + deg / 30 + ' 大格，是 ' + deg + '°' : '');
      if (deg === 360) text += '，轉一圈是周角';
      UI.say(exMsg, text + '。', 'ok');
    }
    exCtrl.appendChild(h('div', { 'class': 'row' }, [
      h('button', { 'class': 'btn', text: '換起點', onclick: function () { start = start % 12 + 1; build(); } }),
      h('button', { 'class': 'btn', text: '重來', onclick: build })
    ]));
    exCtrl.appendChild(h('p', { text: '和鐘面的指針旋轉方向相同，稱為順時針方向旋轉；相反，稱為逆時針方向旋轉。（課本 印p41）' }));
    build();
  }

  // E2 問3–4 印p42
  function exStep() {
    exTitle.textContent = '一大格是幾度？';
    var n = 0, dir = 'cw', showDiv = false, showDeg = true, start = 12;
    var bCw, bCcw, bStep, bDiv, bDeg, bReset, spStartVal;

    function draw() {
      AP.clear(exSvg);
      exText.textContent = '指針從 ' + start + ' 開始往' + DIR[dir] + '方向轉，一次轉一大格（30°）。（可點鐘面數字選起點，可切換「顯示角度」）';
      var to = n === 0 ? start : (dir === 'cw' ? ((start + n - 1) % 12 + 1) : (((start - n - 1) % 12 + 12) % 12 + 1));
      var color = dir === 'ccw' ? '#1565c0' : '#d32f2f';
      var g = drawClockTurn(exSvg, 320, 240, 200, start, to, dir, { noArc: n === 0, color: color });

      // 在鐘面數字上加入點選事件，並標註當前起點
      for (var numI = 1; numI <= 12; numI++) {
        (function (targetNum) {
          var ang = AP.numberAngle(targetNum);
          var numPt = AP.pt(ang, 148);
          // 若為起點，畫一個淡綠色圓圈光環標示起點
          if (targetNum === start) {
            AP.el('circle', {
              cx: numPt.x, cy: numPt.y, r: 18,
              fill: 'rgba(0, 150, 136, 0.22)',
              stroke: '#00796b',
              'stroke-width': 2,
              style: 'pointer-events: none;'
            }, g);
            var tagPt = AP.pt(ang, 116);
            var startTag = AP.el('text', {
              x: tagPt.x, y: tagPt.y + 4,
              'font-size': 11,
              'font-weight': 700,
              'text-anchor': 'middle',
              fill: '#00796b',
              style: 'pointer-events: none;'
            }, g);
            startTag.textContent = '起點';
          }
          // 透明點擊感應區，方便點擊數字切換起點
          var hitC = AP.el('circle', {
            cx: numPt.x, cy: numPt.y, r: 20,
            fill: 'transparent',
            style: 'cursor: pointer;'
          }, g);
          hitC.setAttribute('title', '點擊設為起點 ' + targetNum);
          hitC.addEventListener('click', function () {
            if (start !== targetNum) {
              start = targetNum;
              n = 0;
              bStep.disabled = false;
              if (spStartVal) spStartVal.textContent = start;
              draw();
            }
          });
        })(numI);
      }

      // 若開啟「12 等分線」：在鐘面上繪製 12 條等分射線
      if (showDiv) {
        var divGroup = AP.el('g', { 'class': 'clock-div-lines' });
        for (var i = 1; i <= 12; i++) {
          var dAng = AP.numberAngle(i);
          var pOuter = AP.pt(dAng, 192);
          AP.el('line', {
            x1: 0, y1: 0,
            x2: pOuter.x, y2: pOuter.y,
            stroke: '#0288d1',
            'stroke-width': 1.6,
            'stroke-dasharray': '5 4'
          }, divGroup);
        }
        g.insertBefore(divGroup, g.firstChild ? g.firstChild.nextSibling : null);
      }

      var startAngle = AP.numberAngle(start);

      // 若有旋轉，繪製扇形底色與各大格 30° / 累積度數標籤
      if (n > 0) {
        var span = n * 30 * (dir === 'cw' ? -1 : 1);
        if (Math.abs(span) >= 360) span = dir === 'cw' ? -359.5 : 359.5;
        var wedgeEl = AP.el('path', {
          d: AP.wedgePath(startAngle, startAngle + span, 192),
          fill: dir === 'ccw' ? 'rgba(21, 101, 192, 0.12)' : 'rgba(211, 47, 47, 0.12)',
          style: 'pointer-events: none;'
        });
        g.insertBefore(wedgeEl, g.firstChild ? g.firstChild.nextSibling : null);

        // 若開啟「顯示角度」：建立度數標籤群組
        if (showDeg) {
          var degGroup = AP.el('g', { 'class': 'clock-deg-labels', style: 'pointer-events: none;' }, g);

          // 1. 每一大格內部標記「30°」
          for (var k = 1; k <= n; k++) {
            var midAng = startAngle + (dir === 'cw' ? -1 : 1) * (k - 0.5) * 30;
            var midPt = AP.pt(midAng, 104);
            AP.el('rect', {
              x: midPt.x - 19, y: midPt.y - 11,
              width: 38, height: 22, rx: 11,
              fill: '#ffffff',
              stroke: color,
              'stroke-width': 1.6
            }, degGroup);
            var t30 = AP.el('text', {
              x: midPt.x, y: midPt.y + 4,
              'font-size': 13,
              'font-weight': 700,
              'text-anchor': 'middle',
              fill: color
            }, degGroup);
            t30.textContent = '30°';
          }

          // 2. 外圈交界處標記累積度數（30°, 60°, 90°, 120°...）
          for (var m = 1; m <= n; m++) {
            var cumAng = startAngle + (dir === 'cw' ? -1 : 1) * m * 30;
            var cumDeg = m * 30;
            var cumPt = AP.pt(cumAng, 172);
            var wBox = cumDeg >= 100 ? 42 : 36;
            AP.el('rect', {
              x: cumPt.x - wBox / 2, y: cumPt.y - 11,
              width: wBox, height: 22, rx: 6,
              fill: color
            }, degGroup);
            var tCum = AP.el('text', {
              x: cumPt.x, y: cumPt.y + 4,
              'font-size': 12,
              'font-weight': 700,
              'text-anchor': 'middle',
              fill: '#ffffff'
            }, degGroup);
            tCum.textContent = cumDeg + '°';
          }
        }
      }

      if (spStartVal) spStartVal.textContent = start;

      if (n === 0) {
        var msg0 = '起點設在 ' + start + '。' + (showDiv
          ? '鐘面一圈 360° 平分成 12 份：360° ÷ 12 ＝ 30°（一大格是 30°）。請按「轉一大格」。'
          : '按「轉一大格」；也可按「12 等分線」或「顯示角度」輔助觀察。');
        UI.say(exMsg, msg0);
        return;
      }

      var list = [];
      for (var j = 1; j <= n; j++) list.push(j * 30 + '°');
      var addExpr = [];
      for (var a = 0; a < n; a++) addExpr.push('30°');
      var t = '從 ' + start + ' 往' + DIR[dir] + '方向轉了 ' + n + ' 大格';
      if (showDeg) {
        t += '：' + list.join('、') + '。';
        t += '【累積算式：' + addExpr.join(' ＋ ') + ' ＝ ' + (n * 30) + '°（' + n + ' × 30° ＝ ' + (n * 30) + '°）】';
      } else {
        t += '。轉了幾度呢？（可按「顯示角度」核對）';
      }
      if (n === 12) {
        t += ' 指針轉一整圈是轉了 360 度，我們稱 360 度的角是周角。';
      }
      UI.say(exMsg, t, 'ok');
    }

    function setDir(d) {
      if (dir === d) return;
      dir = d;
      n = 0;
      bCw.classList.toggle('sel', dir === 'cw');
      bCcw.classList.toggle('sel', dir === 'ccw');
      bStep.disabled = false;
      draw();
    }

    bCw = h('button', { 'class': 'btn sel', text: '順時針', onclick: function () { setDir('cw'); } });
    bCcw = h('button', { 'class': 'btn', text: '逆時針', onclick: function () { setDir('ccw'); } });

    bStep = h('button', {
      'class': 'btn primary',
      text: '轉一大格',
      'data-act': 'step',
      onclick: function () {
        if (n < 12) { n++; draw(); }
        bStep.disabled = (n >= 12);
      }
    });

    bDiv = h('button', {
      'class': 'btn',
      text: '12 等分線（360°÷12）',
      onclick: function () {
        showDiv = !showDiv;
        bDiv.classList.toggle('sel', showDiv);
        draw();
      }
    });

    bDeg = h('button', {
      'class': 'btn sel',
      text: '顯示角度',
      title: '切換是否在鐘面上顯示度數',
      onclick: function () {
        showDeg = !showDeg;
        bDeg.classList.toggle('sel', showDeg);
        draw();
      }
    });

    bReset = h('button', {
      'class': 'btn',
      text: '重來',
      onclick: function () {
        n = 0;
        bStep.disabled = false;
        draw();
      }
    });

    spStartVal = h('span', {
      text: start,
      style: 'font-weight: 700; font-size: 1.25rem; min-width: 32px; text-align: center; display: inline-block; color: #00695c;'
    });

    var bStartMinus = h('button', {
      'class': 'btn',
      text: '－',
      title: '起點往前一個數字',
      onclick: function () {
        start = (start + 10) % 12 + 1;
        n = 0;
        bStep.disabled = false;
        spStartVal.textContent = start;
        draw();
      }
    });

    var bStartPlus = h('button', {
      'class': 'btn',
      text: '＋',
      title: '起點往後一個數字',
      onclick: function () {
        start = start % 12 + 1;
        n = 0;
        bStep.disabled = false;
        spStartVal.textContent = start;
        draw();
      }
    });

    exCtrl.appendChild(h('div', { 'class': 'row' }, [
      h('span', { text: '起點：', style: 'font-weight: 600;' }),
      spStartVal,
      bStartMinus,
      bStartPlus,
      h('span', { text: '方向：', style: 'font-weight: 600; margin-left: 8px;' }),
      bCw,
      bCcw
    ]));
    exCtrl.appendChild(h('div', { 'class': 'row' }, [
      bStep,
      bDiv
    ]));
    exCtrl.appendChild(h('div', { 'class': 'row' }, [
      bDeg,
      bReset
    ]));

    draw();
  }

  // E3 問5 印p43
  function exBoth() {
    exTitle.textContent = '同一個起點和終點，兩個方向';
    exText.textContent = '選起點和終點。紅色是順時針，藍色是逆時針。';
    var from = 9, to = 1;
    var spFromVal, spToVal;

    function draw() {
      AP.clear(exSvg);
      var redArrow = addArrowDefs(exSvg, '#d32f2f');
      var blueArrow = addArrowDefs(exSvg, '#1565c0');
      var g = AP.drawClock(exSvg, 320, 240, 200);

      var s = AP.pt(AP.numberAngle(from), 124), e = AP.pt(AP.numberAngle(to), 124);
      AP.el('line', { x1: 0, y1: 0, x2: s.x, y2: s.y, 'class': 'clock-start' }, g);
      AP.el('line', { x1: 0, y1: 0, x2: e.x, y2: e.y, 'class': 'clock-hand' }, g);

      var cw = C.clockTurn(from, to, 'cw'), ccw = C.clockTurn(from, to, 'ccw');

      // 順時針弧：紅色，半徑 70，紅色箭頭
      AP.el('path', {
        d: AP.clockArcPath(from, 'cw', cw.steps, 70),
        'class': 'turn-arc',
        style: 'stroke: #d32f2f;',
        'marker-end': 'url(#' + redArrow + ')'
      }, g);

      // 逆時針弧：藍色，半徑 100，藍色箭頭
      AP.el('path', {
        d: AP.clockArcPath(from, 'ccw', ccw.steps, 100),
        'class': 'turn-arc turn-arc-ccw',
        style: 'stroke: #1565c0;',
        'marker-end': 'url(#' + blueArrow + ')'
      }, g);

      if (spFromVal) spFromVal.textContent = from;
      if (spToVal) spToVal.textContent = to;

      UI.say(exMsg, '從 ' + from + ' 到 ' + to + '：順時針轉 ' + cw.steps + ' 大格，是 ' + cw.degrees + '°；逆時針轉 ' + ccw.steps + ' 大格，是 ' + ccw.degrees + '°。（兩方向合起來是 ' + (cw.degrees + ccw.degrees) + '° 周角）', 'ok');
    }

    function spin(label, get, set) {
      var valSpan = h('span', {
        text: get(),
        style: 'font-weight: 700; font-size: 1.25rem; min-width: 32px; text-align: center; display: inline-block; color: #00695c;'
      });
      if (label === '起點') spFromVal = valSpan;
      else spToVal = valSpan;

      return h('div', { 'class': 'row' }, [
        h('span', { text: label + '：', style: 'min-width: 48px; font-weight: 600;' }),
        valSpan,
        h('button', {
          'class': 'btn',
          text: '－',
          onclick: function () {
            set((get() + 10) % 12 + 1);
            draw();
          }
        }),
        h('button', {
          'class': 'btn',
          text: '＋',
          onclick: function () {
            set(get() % 12 + 1);
            draw();
          }
        })
      ]);
    }

    exCtrl.appendChild(spin('起點', function () { return from; }, function (v) { from = v; }));
    exCtrl.appendChild(spin('終點', function () { return to; }, function (v) { to = v; }));
    draw();
  }

  // E4 大於 180°
  function exBig() {
    exTitle.textContent = '轉過平角以後';
    exText.textContent = '課本用鐘面 12 轉到 8（240°）。這裡換成一般的旋轉角：OA 不動，拖動 OB 往逆時針方向轉。';
    var O = { x: 320, y: 250 }, R = 190, acc = 60, last = null;
    var id = addArrowDefs(exSvg);

    // 180° 平角參考基準線（往左的虛線）
    var flatLine = AP.el('line', {
      x1: O.x, y1: O.y, x2: O.x - R - 10, y2: O.y,
      stroke: '#90a4ae', 'stroke-width': 1.8, 'stroke-dasharray': '6 4'
    }, exSvg);
    var flatTag = AP.el('text', {
      x: O.x - R - 18, y: O.y + 6,
      'font-size': 14, 'font-weight': 600, 'text-anchor': 'end', fill: '#546e7a'
    }, exSvg);
    flatTag.textContent = '180° (平角)';

    var hdB = AP.el('circle', { r: 12, fill: 'rgba(0, 137, 123, 0.35)', stroke: '#00897b', 'stroke-width': 2.5 }, exSvg);

      AP.setRay(ob, O.x, O.y, acc, R + 20);

      var deg = Math.round(acc);

      // 平角參考線高亮
      if (deg >= 180) {
        flatLine.setAttribute('stroke', '#37474f');
        flatLine.setAttribute('stroke-width', '2.2');
        flatTag.setAttribute('fill', '#d32f2f');

      // 在角度上面直接顯示度數徽章
      badgeG.innerHTML = '';

      var t = '從 OA 逆時針旋轉到 OB，旋轉了 ' + deg + '°';

      },
      end: function () { acc = Math.round(acc / 5) * 5; draw(); }
    });

  }

  // 關2–5 鐘面題
  function renderClock(stage, api, cfg) {

      ui.q.textContent = cfg.chooseDir
        ? '指針從數字 ' + it.from + ' 轉到數字 ' + it.to + '。看箭頭，是往哪個方向轉？轉了幾度？'
        : '指針從數字 ' + it.from + ' 往' + DIR[it.dir] + '方向轉到數字 ' + it.to + '，是轉了幾度？';
      var g = drawClockTurn(ui.svg, 320, 240, 200, it.from, it.to, it.dir);

        bCcw = h('button', { 'class': 'btn', text: '逆時針', 'data-dir': 'ccw', onclick: function () { inDir = 'ccw'; bCcw.classList.add('sel'); bCw.classList.remove('sel'); } });

      }

      ui.inputs.appendChild(h('div', { 'class': 'row' }, [st, h('span', { text: '大格 × 30° ＝' }), dg, h('span', { text: '°' })]));
      var wrong = 0;

        if (isNaN(k) || isNaN(d)) { UI.say(ui.msg, '兩格都要填。', 'bad'); return; }
        var r = C.diagnoseClock({ inDir: cfg.chooseDir ? inDir : null, inSteps: k, inDeg: d, from: it.from, to: it.to, targetDir: it.dir });
        st.classList.toggle('okf', r.steps === 'CORRECT'); st.classList.toggle('badf', r.steps !== 'CORRECT');
        dg.classList.toggle('okf', r.deg === 'CORRECT' && r.steps === 'CORRECT'); dg.classList.toggle('badf', !(r.deg === 'CORRECT' && r.steps === 'CORRECT'));
        var msgs = [];
        if (r.dir === 'WRONG_DIR') msgs.push(CLOCK_MSG.WRONG_DIR);
        if (r.steps !== 'CORRECT') { var m = CLOCK_MSG[r.steps]; msgs.push(typeof m === 'function' ? m(it.dir) : m); }
        if (r.deg === 'MUL_ERROR') msgs.push(CLOCK_MSG.MUL_ERROR);
        if (!msgs.length) {
          UI.say(ui.msg, '答對了！' + (cfg.chooseDir ? DIR[it.dir] + '，' : '') + '轉了 ' + r.correctSteps + ' 大格，是 ' + r.correctSteps * 30 + '°。' + (r.correctSteps === 12 ? '轉一圈是周角。' : ''), 'ok');
          nextBtn(ui, idx === cfg.items.length - 1, api, function () { idx++; load(); });

    load();
  }

            pill.style.border = '1px dashed #bdbdbd';
            pill.style.color = '#9e9e9e';
            pill.textContent = '第 ' + (k + 1) + ' 步：往' + DIR[turnK.dir] + '轉 ' + turnK.deg + '°';
          }
          listRow.appendChild(pill);
          runPos = endPos;
        }
        formulaBox.appendChild(listRow);
      }

      function setStick(t) {
        cur = t;
        AP.setRay(stick, V.x, V.y, t, R + 30);
        var e = AP.pt(t, R + 30);
        hd.setAttribute('cx', V.x + e.x);
        hd.setAttribute('cy', V.y + e.y);
      }
      setStick(cur);

      function doTurn() {
        if (hasTurned) return;
        var t = it.turns[stepI];
        turnBtn.disabled = true;
        var col = t.dir === 'ccw' ? '#1565c0' : '#d32f2f';
        var aid = addArrowDefs(ui.svg, col);
        if (currentArc && currentArc.parentNode) currentArc.parentNode.removeChild(currentArc);
        currentArc = AP.el('path', {
          'class': 'turn-arc' + (t.dir === 'ccw' ? ' turn-arc-ccw' : ''),
          style: 'stroke: ' + col + '; stroke-width: 3.5;',
          'marker-end': 'url(#' + aid + ')'
        }, trail);

        var spanTotal = (t.dir === 'cw' ? -1 : 1) * t.deg;
        animate(550, function (k) {
          var nowT = startTheta + spanTotal * k;
          setStick(nowT);
          currentArc.setAttribute('d', AP.arcPath(startTheta, nowT, R * 0.45));
        }, function () {
          setStick(targetTheta);
          currentArc.setAttribute('d', AP.arcPath(startTheta, targetTheta, R * 0.45));
          hasTurned = true;
          turnBtn.textContent = '✓ 已轉動 ' + t.deg + '°';
          goBtn.classList.add('primary');
          inp.focus();
          updateFormulaBox();
          UI.say(ui.msg, '轉好了！請看量角器刻度或上方算式，竹籤現在停在幾度？填入後按「確定」。');
        });
      }

      AP.drag(ui.svg, hd, {
        move: function (p) {
          setStick(p.y > V.y ? (p.x < V.x ? 180 : 0) : Math.round(AP.angleAt(V.x, V.y, p.x, p.y)));
        },
        end: function () {
          var t = it.turns[stepI];
          var reading = C.ringReading(cur, it.style, it.ring);
          if (Math.abs(reading - targetPos) <= 4) {
            setStick(targetTheta);
            var col = t.dir === 'ccw' ? '#1565c0' : '#d32f2f';
            var aid = addArrowDefs(ui.svg, col);
            if (!currentArc) {
              currentArc = AP.el('path', {
                'class': 'turn-arc' + (t.dir === 'ccw' ? ' turn-arc-ccw' : ''),
                style: 'stroke: ' + col + '; stroke-width: 3.5;',
                'marker-end': 'url(#' + aid + ')'
              }, trail);
            }
            currentArc.setAttribute('d', AP.arcPath(startTheta, targetTheta, R * 0.45));
            hasTurned = true;
            turnBtn.textContent = '✓ 已轉動 ' + t.deg + '°';
            turnBtn.disabled = true;
            updateFormulaBox();

            if (expect === targetPos) {
              AP.ray(trail, V.x, V.y, targetTheta, R + 30, 'clock-start');
              pos = targetPos; stepI++;
              updateFormulaBox();
              if (stepI === it.turns.length) {
                UI.say(ui.msg, '對！最後竹籤停在' + RING[it.ring] + '的 ' + pos + ' 度。', 'ok');
                nextBtn(ui, idx === cfg.items.length - 1, api, function () { idx++; load(); });
              } else {
                UI.say(ui.msg, '對！停在 ' + pos + ' 度。接著轉下一步。', 'ok');
                showStep();
              }
            } else {
              goBtn.classList.add('primary');
              inp.focus();
              UI.say(ui.msg, '轉好了！請看量角器刻度或上方算式，竹籤現在停在幾度？填入後按「確定」。');
            }
          } else {
            UI.say(ui.msg, '竹籤現在停在 ' + reading + ' 度，題目是要往' + DIR[t.dir] + '轉 ' + t.deg + '°。可以點按鈕直接轉動。', 'bad');
          }
        }
      });

      function showStep() {
        var t = it.turns[stepI];
        hasTurned = false;
        expect = null;
        startTheta = thetaOf(pos, it.style, it.ring);
        targetPos = C.stickAfter(pos, t.dir, t.deg, it.style, it.ring);
        targetTheta = thetaOf(targetPos, it.style, it.ring);
        currentArc = null;

        var inc = C.ringIncreasesWith(it.style, it.ring);
        var isAdd = (t.dir === inc);
        var opChar = isAdd ? '＋' : '－';
        var opHint = isAdd ? '刻度變大，算式用加法（＋）' : '刻度變小，算式用減法（－）';
        var startText = stepI === 0 ? '從' + RING[it.ring] + ' 0 度線開始，' : '接著從 ' + pos + ' 度開始，';
        stepText.textContent = '第 ' + (stepI + 1) + ' 步：' + startText + '往' + DIR[t.dir] + '方向轉 ' + t.deg + '°。（' + opHint + '：' + pos + '° ' + opChar + ' ' + t.deg + '°）';

        turnBtn.textContent = '往' + DIR[t.dir] + '轉 ' + t.deg + '°';
        turnBtn.disabled = false;
        turnBtn.classList.add('primary');
        turnBtn.onclick = doTurn;

        inp.value = '';
        inp.disabled = false;
        inp.classList.remove('okf', 'badf');
        goBtn.disabled = false;
        goBtn.classList.remove('primary');

        updateFormulaBox();
        UI.say(ui.msg, '可以先點「往' + DIR[t.dir] + '轉 ' + t.deg + '°」按鈕（或拖動竹籤端點），轉完再看刻度填寫。');
      }

      goBtn.onclick = function () {
        var v = parseInt(inp.value, 10), t = it.turns[stepI];
        if (isNaN(v)) { UI.say(ui.msg, '先填一個數字。', 'bad'); return; }
        var r = C.diagnoseStick({ answer: v, start: pos, dir: t.dir, deg: t.deg, style: it.style, ring: it.ring });
        var inc = C.ringIncreasesWith(it.style, it.ring);
        var isAdd = (t.dir === inc);
        var opChar = isAdd ? '＋' : '－';
        if (r.code === 'CORRECT') {
          inp.classList.add('okf');
          inp.classList.remove('badf');
          if (hasTurned) {
            AP.ray(trail, V.x, V.y, targetTheta, R + 30, 'clock-start');
            var prevPos = pos;
            pos = targetPos; stepI++;
            updateFormulaBox();
            if (stepI === it.turns.length) {
              UI.say(ui.msg, '對！算式是 ' + prevPos + '° ' + opChar + ' ' + t.deg + '° ＝ ' + pos + '°。最後竹籤停在' + RING[it.ring] + '的 ' + pos + ' 度。', 'ok');
              nextBtn(ui, idx === cfg.items.length - 1, api, function () { idx++; load(); });
            } else {
              UI.say(ui.msg, '對！算式是 ' + prevPos + '° ' + opChar + ' ' + t.deg + '° ＝ ' + pos + '°。接著轉下一步。', 'ok');
              showStep();
            }
          } else {
            expect = v;
            updateFormulaBox();
            UI.say(ui.msg, '算好了！拖動竹籤的端點，轉到你算的位置驗證看看。', 'ok');
          }
        } else if (r.code === 'REVERSED_OP') {
          inp.classList.add('badf');
          UI.say(ui.msg, '在' + RING[r.ring] + '上，往' + DIR[r.dir] + '轉刻度是' + (isAdd ? '變大，算式應該用加法（＋）' : '變小，算式應該用減法（－）') + '，再算一次。', 'bad');
        } else {
          inp.classList.add('badf');
          UI.say(ui.msg, '竹籤現在停在 ' + pos + ' 度，一步一步照算式轉轉看。', 'bad');
        }
      };
      showStep();
    }
    load();
  }

        var msgs = [];
        var up = C.ringIncreasesWith(it.style, it.ring);
        if (inDir !== need.dir) msgs.push('在' + RING[it.ring] + '上，數字要從 ' + pos + ' 變成 ' + it.target + '，是變大還是變小？往' + DIR[up] + '轉數字會變大。');
        if (v !== need.deg) msgs.push('用兩個刻度相減算算看轉了幾度。');
        if (msgs.length) { UI.say(ui.msg, msgs.join(''), 'bad'); return; }
        UI.say(ui.msg, '答對了！往' + DIR[need.dir] + '方向轉 ' + need.deg + ' 度。', 'ok');
        nextBtn(ui, idx === items.length - 1, api, function () { idx++; load(); });
      } }));
    }
    load();
  }

  // 金庫密碼 教冊 PDF p40（印 p38）
  (function vault() {
    var box = h('div', { 'class': 'side', 'data-q': 'vault' });
    chBox.appendChild(box);
    box.appendChild(h('h2', { text: '數學遊戲：金庫密碼' }));
    box.appendChild(h('p', { 'class': 'src', text: '教冊（資料篇）數學萬花筒 PDF p40（印 p38）。每回合從 12 點鐘方向開始；每一格從上一格的位置接著轉。' }));
    var modeRow = h('div', { 'class': 'row' });
    var area = h('div');
    box.appendChild(modeRow); box.appendChild(area);
    function randomCode() { var c = []; for (var i = 0; i < 4; i++) c.push(rint(1, 12)); return c; }
    function turnsFor(code) {
      return C.vaultTurns(code).map(function (t) {
        var d = Math.random() < 0.5 ? 'cw' : 'ccw', deg = t[d];
        if (deg === 0) deg = 360;
        return { dir: d, deg: deg };
      });
    }
    function mode1() {
      area.innerHTML = '';
      var code = randomCode(), turns = turnsFor(code), got = [];
      area.appendChild(h('p', { 'class': 'q', text: '老師說：' + turns.map(function (t) { return DIR[t.dir] + '轉 ' + t.deg + ' 度'; }).join('，再') + '。密碼是什麼？' }));
      var svg = AP.el('svg', { viewBox: '0 0 400 400', style: 'max-width:380px' });
      var board = h('div', { 'class': 'board' }); board.appendChild(svg); area.appendChild(board);
      var show = h('div', { 'class': 'q', text: '密碼：□ □ □ □' });
      var msg = h('div', { 'class': 'msg' });
      area.appendChild(show);
      var g = AP.drawClock(svg, 200, 200, 170);
      for (var n = 1; n <= 12; n++) (function (n) {
        var p = AP.pt(AP.numberAngle(n), 170 * 0.74);
        var c = AP.el('circle', { cx: 200 + p.x, cy: 200 + p.y, r: 24, fill: 'transparent', 'data-num': n, style: 'cursor:pointer' }, svg);
        c.addEventListener('click', function () {
          if (got.length >= 4) return;
          got.push(n);
          show.textContent = '密碼：' + [0, 1, 2, 3].map(function (i) { return got[i] || '□'; }).join(' ');
          if (got.length === 4) {
            var ok = got.every(function (v, i) { return v === code[i]; });
            UI.say(msg, ok ? '金庫打開了！' : '密碼不對。正確是 ' + code.join(' ') + '。記得每一格要從上一格的位置接著轉。', ok ? 'ok' : 'bad');
          }
        });
      })(n);
      void g;
      area.appendChild(h('div', { 'class': 'row' }, [h('button', { 'class': 'btn', text: '換一組', onclick: mode1 }),
        h('button', { 'class': 'btn', text: '清除', onclick: function () { got = []; show.textContent = '密碼：□ □ □ □'; UI.say(msg, ''); } })]));
      area.appendChild(msg);
    }
    function mode2() {
      area.innerHTML = '';
      var code = randomCode();
      area.appendChild(h('p', { 'class': 'q', text: '密碼是 ' + code.join(' ') + '。說出每一格要往哪個方向轉幾度（方向自己決定）。' }));
      var rows = [], msg = h('div', { 'class': 'msg' });
      code.forEach(function (c, i) {
        var dir = null, deg = num('v' + i), bw, bc;

        bc = h('button', { 'class': 'btn', text: '逆時針', onclick: function () { dir = 'ccw'; bc.classList.add('sel'); bw.classList.remove('sel'); } });

      });
      area.appendChild(h('div', { 'class': 'row' }, [h('button', { 'class': 'btn primary', text: '開金庫', onclick: function () {
        var turns = rows.map(function (f) { return f(); });
        if (turns.some(function (t) { return !t.dir || isNaN(t.deg); })) { UI.say(msg, '每一格都要選方向、填度數。', 'bad'); return; }

        var bad = [];
        decoded.forEach(function (v, i) { if (v !== code[i]) bad.push(i + 1); });
        UI.say(msg, bad.length ? '第 ' + bad.join('、') + ' 格轉到的數字不對（照你說的轉，會停在 ' + decoded.join(' ') + '）。' : '金庫打開了！', bad.length ? 'bad' : 'ok');
      } }), h('button', { 'class': 'btn', text: '換一組', onclick: mode2 })]));
      area.appendChild(msg);
    }
    modeRow.appendChild(h('button', { 'class': 'btn', text: '聽指令找密碼', onclick: mode1 }));

    mode1();
  })();
